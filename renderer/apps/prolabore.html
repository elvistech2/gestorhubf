<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financeiro · {marca}</title>
<meta name="theme-color" content="#060a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<style>
.boletos-linha{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:-4px 0 12px}
.boletos-chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted2);cursor:pointer;user-select:none}
.boletos-chk input{width:14px;height:14px;cursor:pointer}
.boletos-resumo{font-size:11.5px;color:var(--muted)}
.boletos-resumo code{background:rgba(255,255,255,.06);padding:1px 5px;border-radius:4px;font-size:11px}
.boletos-resumo.ativo{color:var(--txt);font-weight:600}
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#060a14;--s1:#0c1220;--s2:#111827;--s3:#17213a;--border:#1e2d44;--border2:#263550;--text:#e2eaff;--muted:#4a5e82;--muted2:#6a7fa8;--teal:#00d4a0;--teal-d:#009e78;--teal-glow:rgba(0,212,160,.15);--purple:#8b72f0;--red:#ff4f6a;--yellow:#f5c842;--blue:#4db8ff;--orange:#ff9a44}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;height:100vh;overflow:hidden}
.layout{display:flex;flex-direction:column;height:100vh}
/* ── navegação em abas no topo ── */
.topnav{
  display:flex;align-items:center;gap:16px;flex-shrink:0;
  background:linear-gradient(180deg,var(--s1),#0a1020);
  border-bottom:1px solid var(--border);padding:0 20px;height:52px
}
.topnav-marca{
  display:flex;align-items:center;gap:9px;flex-shrink:0;padding-right:16px;
  border-right:1px solid var(--border);height:100%;
  font-size:13.5px;font-weight:700;letter-spacing:-.2px
}
.tn-cruz{
  width:26px;height:26px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#02120d;
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700
}
.topnav-abas{display:flex;align-items:center;gap:1px;overflow-x:auto;height:100%;flex:1;scrollbar-width:none}
.topnav-abas::-webkit-scrollbar{display:none}
.nav-item{
  display:flex;align-items:center;gap:5px;padding:0 9px;height:100%;cursor:pointer;
  color:var(--muted2);font-size:12px;white-space:nowrap;user-select:none;position:relative;
  border-bottom:2px solid transparent;transition:color .15s,background .15s
}
/* espaço apertado: primeiro some a marca, depois os rótulos menos usados */
@media(max-width:1180px){ .topnav-marca{display:none} }
@media(max-width:980px){ .nav-item .rot-longo{display:none} .nav-item{padding:0 12px} }
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.035)}
.nav-item.active{color:var(--teal);border-bottom-color:var(--teal);background:linear-gradient(180deg,transparent,rgba(0,212,160,.08))}
.nav-item .ni{font-size:14px;flex-shrink:0}
.nav-pill{
  background:var(--orange);color:#000;font-size:9px;font-weight:800;
  padding:1px 6px;border-radius:10px;letter-spacing:.3px;margin-left:2px
}
.nav-pill.red{background:var(--red);color:#fff}
.main{flex:1;overflow-y:auto;padding:20px 24px 34px;background:var(--bg)}
.page{display:none}.page.active{display:block}
.page-title{font-size:20px;font-weight:700;letter-spacing:-.3px}
.sec-ttl{font-size:13px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.5px}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
/* CG strip */
.cg-strip{background:linear-gradient(135deg,#0a1a2e,#0d1f3a 55%,#091825);border:1px solid rgba(0,212,160,.18);border-radius:14px;padding:18px 22px;margin-bottom:12px;display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;position:relative;overflow:hidden}
.cg-strip::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:radial-gradient(circle,rgba(0,212,160,.1),transparent 70%);pointer-events:none}
.cg-block{position:relative;z-index:1}
.cg-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--teal);opacity:.85;margin-bottom:4px}
.cg-value{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.cg-value.pos{color:var(--teal);text-shadow:0 0 30px rgba(0,212,160,.25)}
.cg-value.neg{color:var(--red);text-shadow:0 0 30px rgba(255,79,106,.25)}
.cg-projected{font-size:11px;color:var(--muted2);margin-top:4px}
.cg-projected strong{font-weight:700;font-variant-numeric:tabular-nums}
.cg-meter{position:relative;z-index:1}
.cg-meter-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:11px;color:var(--muted2)}
.cg-meter-top strong{color:var(--text);font-weight:700}
.cg-bar-wrap{background:rgba(255,255,255,.06);border-radius:8px;height:8px;overflow:hidden}
.cg-bar-fill{height:100%;border-radius:8px;transition:width .6s cubic-bezier(.4,0,.2,1),background .4s}
.cg-bar-labels{display:flex;justify-content:space-between;margin-top:5px}
.cg-bar-labels span{font-size:10px;color:var(--muted)}
.cg-actions{display:flex;flex-direction:column;gap:6px;position:relative;z-index:1;text-align:right}
.cg-edit{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.05);border:1px solid var(--border2);border-radius:7px;padding:6px 11px;cursor:pointer;font-size:11px;color:var(--muted2);transition:.15s;white-space:nowrap}
.cg-edit:hover{background:rgba(255,255,255,.1);color:var(--text)}
/* alerts */
.alert{display:flex;align-items:center;gap:10px;background:rgba(255,79,106,.08);border:1px solid rgba(255,79,106,.25);border-radius:10px;padding:11px 16px;margin-bottom:12px;font-size:13px}
.alert strong{color:var(--red)}
.alert.warn{background:rgba(255,154,68,.08);border-color:rgba(255,154,68,.3)}
.alert.warn strong{color:var(--orange)}
.alert.info{background:rgba(77,184,255,.08);border-color:rgba(77,184,255,.25)}
.alert.info strong{color:var(--blue)}
/* month nav */
.month-nav{display:flex;align-items:center;gap:6px}
.m-label{font-size:13px;font-weight:600;min-width:130px;text-align:center;text-transform:capitalize}
.btn-icon{background:var(--s2);border:1px solid var(--border);color:var(--muted2);padding:5px 11px;border-radius:7px;cursor:pointer;font-size:14px;line-height:1;transition:.15s}
.btn-icon:hover{background:var(--s3);color:var(--text)}
.btn-today{background:var(--s2);border:1px solid var(--border);color:var(--muted2);padding:5px 10px;border-radius:7px;cursor:pointer;font-size:11px;font-weight:600;transition:.15s;letter-spacing:.3px;text-transform:uppercase;margin-left:4px}
.btn-today:hover{background:var(--s3);color:var(--text)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
.btn-t{background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#020e0a}.btn-t:hover{filter:brightness(1.1)}
.btn-g{background:var(--s2);border:1px solid var(--border2);color:var(--muted2)}.btn-g:hover{background:var(--s3);color:var(--text)}
.btn-d{background:rgba(255,79,106,.1);color:var(--red);border:1px solid rgba(255,79,106,.2)}.btn-d:hover{background:rgba(255,79,106,.2)}
.btn-s{background:rgba(0,212,160,.1);color:var(--teal);border:1px solid rgba(0,212,160,.2)}.btn-s:hover{background:rgba(0,212,160,.2)}
.qa-dupla{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qa-dupla .btn{justify-content:center}
@media(max-width:520px){.qa-dupla{grid-template-columns:1fr}}
.btn-o{background:rgba(255,154,68,.1);color:var(--orange);border:1px solid rgba(255,154,68,.25)}.btn-o:hover{background:rgba(255,154,68,.2)}
.btn-sm{padding:4px 9px;font-size:12px;font-weight:500}
.btn-ghost{background:transparent;color:var(--muted2);border:none;padding:4px 6px;font-size:12px;cursor:pointer;border-radius:5px;transition:.15s}
.btn-ghost:hover{background:var(--s2);color:var(--text)}
/* status toggle */
.status-toggle{display:flex;background:var(--s2);border:1px solid var(--border2);border-radius:8px;padding:3px;gap:2px;margin-top:5px}
.status-toggle button{flex:1;background:transparent;border:none;color:var(--muted2);padding:7px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.status-toggle button.active.liq{background:rgba(0,212,160,.15);color:var(--teal)}
.status-toggle button.active.pen{background:rgba(255,154,68,.15);color:var(--orange)}
.status-toggle button:hover:not(.active){color:var(--text)}
/* form */
.form-card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:18px}
.form-card-title{font-size:11px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}
.form-row{display:grid;gap:10px;margin-bottom:12px}
.fr5{grid-template-columns:1.3fr 1.7fr 1fr 1fr 1.3fr}
.fr3{grid-template-columns:2fr 1fr 1fr}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:11px;color:var(--muted2);font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.fg input,.fg select{background:var(--s2);border:1px solid var(--border2);color:var(--text);padding:9px 12px;border-radius:8px;font-size:13px;outline:none;width:100%;transition:.15s}
.fg input:focus,.fg select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,212,160,.1)}
.fg input::placeholder{color:var(--muted)}
/* table */
.tbl-wrap{background:var(--s1);border:1px solid var(--border);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{padding:10px 14px;font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);border-bottom:1px solid var(--border);text-align:left;font-weight:700;background:var(--s2)}
td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.lanc-row{cursor:pointer;transition:.1s}
tr.lanc-row:hover td{background:rgba(255,255,255,.025)}
tr.pending td:nth-child(3){color:var(--muted2)}
tr.overdue{background:rgba(255,79,106,.04)}
.row-actions{opacity:0;transition:.15s;display:flex;gap:4px;justify-content:flex-end}
tr.lanc-row:hover .row-actions{opacity:1}
.search-bar{position:relative;flex:1;max-width:280px}
.search-bar input{background:var(--s2);border:1px solid var(--border);color:var(--text);padding:7px 12px 7px 32px;border-radius:8px;font-size:12px;width:100%;outline:none}
.search-bar input:focus{border-color:var(--teal)}
.search-bar::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:11px;opacity:.6}
.filter-tabs{display:flex;gap:4px;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:3px}
.filter-tabs button{background:transparent;border:none;color:var(--muted2);padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;transition:.15s}
.filter-tabs button.active{background:var(--s3);color:var(--text)}
.filter-tabs button:hover:not(.active){color:var(--text)}
.filter-tabs .count{opacity:.6;margin-left:3px;font-weight:500}
/* badges */
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
.bg{background:rgba(0,212,160,.12);color:var(--teal)}
.br{background:rgba(255,79,106,.12);color:var(--red)}
.bp{background:rgba(139,114,240,.12);color:var(--purple)}
.b-pending{background:rgba(255,154,68,.12);color:var(--orange)}
.b-overdue{background:rgba(255,79,106,.18);color:var(--red)}
.b-liq{background:rgba(0,212,160,.1);color:var(--teal);opacity:.7}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle}
.sd-liq{background:var(--teal)}
.sd-pen{background:var(--orange)}
.sd-over{background:var(--red)}
/* dashboard grid */
.dash-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
.panel{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:16px}
/* calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:10px;color:var(--muted);font-weight:700;padding:4px 0;letter-spacing:.5px}
.cal-day{border-radius:8px;padding:6px 5px 5px;cursor:pointer;min-height:64px;transition:.15s;border:1px solid transparent;display:flex;flex-direction:column;background:var(--s2);position:relative;overflow:hidden}
.cal-day.empty-day{background:transparent;pointer-events:none;opacity:0}
.cal-day:not(.empty-day):hover{background:var(--s3);transform:translateY(-1px)}
.cal-day.today{background:rgba(0,212,160,.06);border-color:rgba(0,212,160,.4)}
.cal-day.selected{border-color:var(--teal);background:rgba(0,212,160,.08);box-shadow:0 0 0 3px rgba(0,212,160,.1)}
.cal-day.has-overdue{border-color:rgba(255,79,106,.4)}
.cal-day.has-pending::after{content:'';position:absolute;top:5px;right:5px;width:5px;height:5px;background:var(--orange);border-radius:50%;box-shadow:0 0 6px rgba(255,154,68,.6)}
.cal-day.has-overdue::after{background:var(--red);box-shadow:0 0 6px rgba(255,79,106,.7)}
.cal-day.empty-day-data .cal-num{color:var(--muted2);font-weight:500}
.cal-num-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:auto}
.cal-num{font-size:13px;font-weight:700;color:var(--text)}
.cal-day.today .cal-num{color:var(--teal)}
.cal-net{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;text-align:right;margin-top:3px}
.cal-net.pen{opacity:.55;font-style:italic}
.cal-bars{display:flex;gap:2px;height:4px;margin-top:4px;align-items:flex-end}
.cal-bar{flex:1;border-radius:1px;min-height:1px;opacity:.85}
.cal-bar.pen{opacity:.4}
.cal-bar-r{background:var(--teal)}.cal-bar-p{background:var(--red)}.cal-bar-pro{background:var(--purple)}
/* day panel / insights tabs */
.insights-tabs{display:flex;gap:2px;margin-bottom:12px;border-bottom:1px solid var(--border);overflow-x:auto}
.itab{padding:8px 11px;font-size:12px;font-weight:600;color:var(--muted2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s;white-space:nowrap}
.itab:hover{color:var(--text)}
.itab.active{color:var(--teal);border-bottom-color:var(--teal)}
.day-panel-content{min-height:340px;max-height:calc(100vh - 380px);overflow-y:auto;padding-right:4px}
.day-empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:13px}
.day-empty .icon{font-size:28px;margin-bottom:8px;opacity:.4}
.day-header{font-size:14px;font-weight:700;margin-bottom:2px}
.day-sub{font-size:11px;color:var(--muted2);margin-bottom:12px}
.day-group-ttl{font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--muted2);margin:10px 0 4px;display:flex;justify-content:space-between;align-items:center}
.day-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;gap:8px}
.day-item:last-child{border-bottom:none}
.day-item-info{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted2)}
.day-item.pending .day-item-info{font-style:italic}
.day-item-val{font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums}
.day-item-val.pen{opacity:.55;text-decoration:line-through;text-decoration-thickness:1px}
.day-quick-liq{background:transparent;border:1px solid rgba(0,212,160,.3);color:var(--teal);padding:2px 7px;border-radius:5px;font-size:10px;cursor:pointer;font-weight:600}
.day-quick-liq:hover{background:rgba(0,212,160,.15)}
.day-total{display:flex;justify-content:space-between;align-items:center;padding:11px 0 2px;font-size:13px;font-weight:700;border-top:1px solid var(--border2);margin-top:8px}
/* kpi */
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.kpi-l{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:3px}
.kpi-v{font-size:15px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.kpi-d{font-size:10px;font-weight:600;margin-top:2px}
.kpi-d.up{color:var(--teal)}.kpi-d.down{color:var(--red)}
.cat-list-mini{display:flex;flex-direction:column;gap:6px}
.cat-bar{display:flex;flex-direction:column;gap:3px}
.cat-bar-top{display:flex;justify-content:space-between;font-size:11px}
.cat-bar-name{color:var(--muted2)}
.cat-bar-val{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.cat-bar-track{background:var(--s2);border-radius:3px;height:5px;overflow:hidden}
.cat-bar-fill{height:100%;border-radius:3px;transition:width .4s}
/* pizza */
.pizza-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pizza-card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:16px}
.pizza-wrap{display:flex;align-items:center;gap:14px}
.pizza-svg{flex-shrink:0}
.pizza-legend{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11px;min-width:0}
.pizza-leg{display:flex;align-items:center;gap:6px;padding:3px 0;cursor:pointer;border-radius:4px;transition:.15s}
.pizza-leg:hover{background:var(--s2)}
.pizza-leg-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.pizza-leg-name{flex:1;color:var(--muted2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pizza-leg-pct{color:var(--text);font-weight:700;font-size:10px;min-width:38px;text-align:right}
.pizza-center{font-size:10px;font-weight:600;fill:var(--muted2);text-anchor:middle}
.pizza-center-v{font-size:14px;font-weight:800;fill:var(--text);text-anchor:middle}
.pizza-empty{text-align:center;padding:30px 10px;color:var(--muted);font-size:12px}
/* chart */
.chart-wrap{position:relative}
.chart-tooltip{position:absolute;background:var(--s3);border:1px solid var(--border2);border-radius:8px;padding:8px 11px;font-size:11px;pointer-events:none;opacity:0;transition:.1s;white-space:nowrap;z-index:10;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.chart-tooltip.show{opacity:1}
.chart-tooltip .tt-d{color:var(--muted2);font-size:10px;margin-bottom:4px}
.chart-tooltip .tt-line{display:flex;justify-content:space-between;gap:14px;font-weight:600}
.chart-tooltip .tt-line.r{color:var(--teal)}
.chart-tooltip .tt-line.p{color:var(--red)}
.chart-tooltip .tt-line.cg{color:var(--text);border-top:1px solid var(--border2);padding-top:4px;margin-top:4px}
/* upcoming card */
.upcoming-card{background:linear-gradient(135deg,rgba(255,154,68,.06),rgba(0,212,160,.04));border:1px solid rgba(255,154,68,.2);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.upcoming-list{display:flex;flex-direction:column;gap:6px;max-height:140px;overflow-y:auto}
.upcoming-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}
.upcoming-item:last-child{border-bottom:none}
.upcoming-item-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.upcoming-item-cat{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upcoming-item-meta{color:var(--muted2);font-size:10px}
.upcoming-item-val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
/* categorias */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cat-section{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:18px}
.cat-list{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.cat-item{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;background:var(--s2);border:1px solid var(--border);border-radius:8px;transition:.15s}
.cat-item:hover{border-color:var(--border2)}
.cat-name{font-size:13px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:99;backdrop-filter:blur(4px)}
.modal-bg.show{display:flex}

.adv-card .cc{font-size:11px;margin-top:3px;color:var(--muted2);font-variant-numeric:tabular-nums}

/* day tags / condições */

.daytag-chips{display:flex;flex-wrap:wrap;gap:6px}
.daytag{background:var(--s2);border:1px solid var(--border2);color:var(--muted2);padding:4px 9px;border-radius:14px;font-size:11px;cursor:pointer;transition:.15s;user-select:none}

/* welcome */

<div class="layout">
  <!-- navegação em abas no topo: o menu lateral do hub já é a barra da
       esquerda, duas barras juntas comiam a tela e confundiam -->

<script>
// ── STATE ────────────────────────────────────────────
const KEY='gestor_v1';
const LEGACY='gestor_v0';
const DEF={cgBase:0,categories:{recebimentos:['Vendas','Serviços','Convênios','Outros'],pagamentos:['Fornecedores','Aluguel','Energia/Água','Impostos','Salários','Material de Escritório','Outros']},lancamentos:[]};
let S=loadState();
// normalização aditiva (100% compatível com dados antigos): condições/tags de dia
if(!S.dayTags||typeof S.dayTags!=='object')S.dayTags={};
if(!Array.isArray(S.tagLibrary))S.tagLibrary=['☀️ Sol','🌧️ Chuva','☁️ Nublado','🔥 Movimentado','🐌 Fraco','🎉 Evento na cidade','💊 Campanha/vacinação','💰 Dia de pagamento'];
// v7 — aditivo, não mexe em nada que já existe
if(!Array.isArray(S.recorrencias))S.recorrencias=[];
if(!S.budgets||typeof S.budgets!=='object')S.budgets={};
if(typeof S.lastBackup!=='string')S.lastBackup='';

function loadState(){
  try{
    return window.api.loadState();
  }catch{return JSON.parse(JSON.stringify(DEF));}
}
function save(){try{window.api.saveState(JSON.parse(JSON.stringify(S)));}catch(e){}}

// ── HELPERS ──────────────────────────────────────────
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function brl(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);}
function brlShort(v){const a=Math.abs(v);if(a>=1000000)return (v<0?'-':'')+'R$'+(a/1000000).toFixed(1)+'M';if(a>=1000)return (v<0?'-':'')+'R$'+(a/1000).toFixed(1)+'k';return brl(v);}
function fmtDate(d){if(!d)return'';const[y,m,dd]=d.split('-');return`${dd}/${m}/${y}`;}
function todayStr(){return new Date().toISOString().split('T')[0];}
function daysBetween(a,b){const da=new Date(a+'T12:00:00'),db=new Date(b+'T12:00:00');return Math.round((db-da)/86400000);}
const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function isOverdue(l){return l.status==='pendente'&&l.data<todayStr();}

// PIE colors palette
const PIE=['#00d4a0','#8b72f0','#4db8ff','#f5c842','#ff9a44','#ff4f6a','#7dd3fc','#a78bfa','#34d399','#fbbf24'];

// ── NAV STATE ────────────────────────────────────────
let page='dashboard',fY=new Date().getFullYear(),fM=new Date().getMonth()+1;
let selectedDay=null;
let dashTab='insights';
let lancFilter='';
let lancStatusFilter='all'; // 'all' | 'liquidado' | 'pendente'
let advStatsMode='dia'; // 'dia' (dia do mês) | 'util' (dias de funcionamento seg–sáb)
let advStatsBase='real'; // 'real' (só liquidado) | 'prog' (liquidado + agendado/pendente)
let advView='cmp'; // 'cmp' (comparativo) | 'tags' (condições do dia)
const PAGES=['dashboard','radar','recebimentos','pagamentos','prolabore','agenda','recorrencias','busca','categorias','dados'];

function navigate(p){
  page=p;
  document.querySelectorAll('.nav-item').forEach((el,i)=>el.classList.toggle('active',PAGES[i]===p));
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  if(p==='dashboard'){const t=new Date();if(t.getFullYear()===fY&&t.getMonth()+1===fM)selectedDay=todayStr();else selectedDay=null;}
  render(p);
  refreshSidebarBadges();
}
function render(p){({dashboard:renderDash,radar:renderRadar,recebimentos:()=>renderLanc('recebimento'),pagamentos:()=>renderLanc('pagamento'),prolabore:renderPro,agenda:renderAgenda,recorrencias:renderRecs,busca:renderBusca,categorias:renderCats,dados:renderDados})[p]?.();}
function shift(d){fM+=d;if(fM>12){fM=1;fY++;}if(fM<1){fM=12;fY--;}selectedDay=null;render(page);}
function goToday(){const t=new Date();fY=t.getFullYear();fM=t.getMonth()+1;selectedDay=todayStr();render(page);}

function refreshSidebarBadges(){
  const items=document.querySelectorAll('.nav-item');
  items.forEach(el=>{const p=el.querySelector('.nav-pill');if(p)p.remove();});
  const overdue=S.lancamentos.filter(l=>isOverdue(l));
  if(overdue.length>0){
    const agendaItem=items[PAGES.indexOf('agenda')];
    const pill=document.createElement('span');
    pill.className='nav-pill red';
    pill.textContent=overdue.length;
    pill.title=`${overdue.length} vencido(s)`;
    agendaItem.appendChild(pill);
  }else{
    const pen=S.lancamentos.filter(l=>l.status==='pendente').length;
    if(pen>0){
      const agendaItem=items[PAGES.indexOf('agenda')];
      const pill=document.createElement('span');
      pill.className='nav-pill';
      pill.textContent=pen;
      agendaItem.appendChild(pill);
    }
  }
}

// ── CALCS ────────────────────────────────────────────
function getLancs(tipo,y,m,opts={}){
  return S.lancamentos.filter(l=>{
    if(tipo&&l.tipo!==tipo)return false;
    if(opts.status&&l.status!==opts.status)return false;
    if(y&&m){const d=new Date(l.data+'T12:00:00');return d.getFullYear()===y&&d.getMonth()+1===m;}
    return true;
  });
}
function sum(arr){return arr.reduce((a,b)=>a+(b.valor||0),0);}
// CG real = só liquidado
function calcCG(){
  return S.cgBase
    +sum(S.lancamentos.filter(l=>l.tipo==='recebimento'&&l.status==='liquidado'))
    -sum(S.lancamentos.filter(l=>l.tipo==='pagamento'&&l.status==='liquidado'))
    -sum(S.lancamentos.filter(l=>l.tipo==='prolabore'&&l.status==='liquidado'));
}
// CG projetado = liquidado + pendentes (todos)
function calcCGProj(){
  return S.cgBase
    +sum(S.lancamentos.filter(l=>l.tipo==='recebimento'))

    -sum(S.lancamentos.filter(l=>l.tipo==='prolabore'));
}
function monthStats(y,m){

function cgAtStartOfMonth(year,month){

function topCategories(tipo,y,m,n=4){

function categoryBreakdown(tipo,y,m){

function deltaPct(cur,prev){if(prev===0)return cur===0?0:null;return ((cur-prev)/Math.abs(prev))*100;}
function upcomingPending(days=7){

// ── COMPARATIVO POR PERÍODO (MTD) ─────────────────────
// "dia útil" aqui = dia de funcionamento do negócio: seg a sáb (domingo fora). Feriados não são considerados.
function isUtilDay(dt){return dt.getDay()!==0;}
function countUtilDays(y,m,fromDay,toDay){let c=0;for(let d=fromDay;d<=toDay;d++){if(isUtilDay(new Date(y,m-1,d)))c++;}return c;}
// dia do mês em que o N-ésimo dia útil acontece (para casar a proporção no mês anterior)
function dayForUtilCount(y,m,target){const dim=new Date(y,m,0).getDate();let c=0;for(let d=1;d<=dim;d++){if(isUtilDay(new Date(y,m-1,d)))c++;if(c>=target)return d;}return dim;}
// lançamentos de um mês entre os dias [fromDay,toDay] (usa l.data, igual monthStats)
// base='real' => só liquidado | base='prog' => liquidado + agendado(pendente)
function lancsRange(y,m,fromDay,toDay,tipo,base){
  return S.lancamentos.filter(l=>{
    if(base==='prog'){if(l.status!=='liquidado'&&l.status!=='pendente')return false;}
    else{if(l.status!=='liquidado')return false;}
    if(tipo&&l.tipo!==tipo)return false;
    const d=new Date(l.data+'T12:00:00');
    if(d.getFullYear()!==y||d.getMonth()+1!==m)return false;
    const day=d.getDate();
    return day>=fromDay&&day<=toDay;
  });
}
function statsRange(y,m,fromDay,toDay,base){
  const ls=lancsRange(y,m,fromDay,toDay,null,base);
  const rec=sum(ls.filter(l=>l.tipo==='recebimento'));
  const pag=sum(ls.filter(l=>l.tipo==='pagamento'));
  const pro=sum(ls.filter(l=>l.tipo==='prolabore'));
  return{rec,pag,pro,saldo:rec-pag-pro,count:ls.length};
}
function catMapRange(tipo,y,m,fromDay,toDay,base){
  const map={};lancsRange(y,m,fromDay,toDay,tipo,base).forEach(l=>{map[l.categoria]=(map[l.categoria]||0)+l.valor;});return map;
}

// receita/pagamento liquidados por dia + agregação por tag
function tagPerformance(){
  const recByDay={},pagByDay={};
  S.lancamentos.forEach(l=>{
    if(l.status!=='liquidado')return;
    if(l.tipo==='recebimento')recByDay[l.data]=(recByDay[l.data]||0)+l.valor;
    else if(l.tipo==='pagamento')pagByDay[l.data]=(pagByDay[l.data]||0)+l.valor;
  });

  Object.entries(S.dayTags).forEach(([date,tags])=>{

      stats[t].rec+=r;stats[t].pag+=p;

  const baseline=recDays.length?recDays.reduce((a,b)=>a+b,0)/recDays.length:0;

// ══ v7 · RECORRÊNCIAS ═══════════════════════════════
const REC_HORIZON=150; // dias à frente que o app materializa
const WDFULL=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const WD3=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

function addDaysISO(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return isoD(d);}

function recLabel(r){
  if(r.freq==='mensal')return r.modo==='util'?`Todo mês · ${r.dia}º dia útil`:`Todo mês · dia ${r.dia}`;
  if(r.freq==='semanal')return `Toda ${WDFULL[r.dia]}`;
  if(r.freq==='quinzenal')return `A cada 14 dias`;
  if(r.freq==='anual')return `Todo ano · ${r.inicio.slice(8,10)}/${r.inicio.slice(5,7)}`;
  return '';
}

// datas de ocorrência dentro de [fromISO,toISO]
function recOccurrences(r,fromISO,toISO){
  let out=[];
  const start=r.inicio>fromISO?r.inicio:fromISO;
  const end=(r.fim&&r.fim<toISO)?r.fim:toISO;
  if(end<start)return out;
  if(r.freq==='mensal'){
    let y=parseInt(start.slice(0,4)),m=parseInt(start.slice(5,7));
    for(let i=0;i<26;i++){
      const dim=new Date(y,m,0).getDate();
      const day=r.modo==='util'?dayForUtilCount(y,m,Math.min(Math.max(1,r.dia),26)):Math.min(Math.max(1,r.dia),dim);
      const iso=y+'-'+pad2i(m)+'-'+pad2i(day);
      if(iso>end)break;
      if(iso>=start&&iso>=r.inicio)out.push(iso);
      m++;if(m>12){m=1;y++;}
    }
  }else if(r.freq==='anual'){
    const mm=r.inicio.slice(5,7),dd=r.inicio.slice(8,10);
    let y=parseInt(start.slice(0,4));
    for(let i=0;i<6;i++){
      const iso=y+'-'+mm+'-'+dd;
      if(iso>end)break;
      if(iso>=start&&iso>=r.inicio)out.push(iso);
      y++;
    }
  }else{
    const step=r.freq==='semanal'?7:14;
    let anchor=r.inicio;
    if(r.freq==='semanal'){
      let g=0;
      while(new Date(anchor+'T12:00:00').getDay()!==r.dia&&g++<7)anchor=addDaysISO(anchor,1);
    }
    let cur=anchor,guard=0;
    while(guard++<600){
      if(cur>end)break;
      if(cur>=start)out.push(cur);
      cur=addDaysISO(cur,step);
    }
  }
  // domingo é dia fechado — empurra pra segunda quando marcado
  if(r.ajusteDomingo)out=out.map(iso=>new Date(iso+'T12:00:00').getDay()===0?addDaysISO(iso,1):iso);
  return out;
}

// gera os agendamentos futuros que ainda não existem
function materializeRecs(){
  const from=todayStr(),to=addDaysISO(from,REC_HORIZON);
  let added=0;
  (S.recorrencias||[]).forEach(r=>{
    if(!r.ativa)return;
    recOccurrences(r,from,to).forEach(iso=>{
      if(S.lancamentos.some(l=>l.recId===r.id&&l.recDate===iso))return;
      S.lancamentos.push({id:uid(),tipo:r.tipo,categoria:r.categoria,descricao:r.descricao||'',valor:r.valor,data:iso,status:'pendente',dataLiq:null,recId:r.id,recDate:iso});
      added++;
    });
  });
  if(added)save();
  return added;
}
function recFutureCount(id){const t=todayStr();return S.lancamentos.filter(l=>l.recId===id&&l.status==='pendente'&&l.data>=t).length;}
function recMonthlyLoad(){ // impacto mensal estimado das recorrências ativas
  let rec=0,out=0;
  (S.recorrencias||[]).forEach(r=>{
    if(!r.ativa)return;
    const mult=r.freq==='mensal'?1:r.freq==='semanal'?4.345:r.freq==='quinzenal'?2.17:1/12;
    if(r.tipo==='recebimento')rec+=r.valor*mult;else out+=r.valor*mult;
  });
  return{rec,out};

// ══ v7 · BASE ESTATÍSTICA PARA PROJEÇÃO ═════════════
// média de recebimento liquidado por dia da semana (últimos 120 dias com movimento)
function weekdayAvgRec(){
  const map=recByDateMap();
  const cut=addDaysISO(todayStr(),-119),t=todayStr();
  const agg=Array.from({length:7},()=>({tot:0,n:0}));
  Object.entries(map).forEach(([d,v])=>{
    if(d<cut||d>t||v<=0)return;
    const wd=new Date(d+'T12:00:00').getDay();
    agg[wd].tot+=v;agg[wd].n++;
  });
  const arr=agg.map(a=>a.n?a.tot/a.n:0);
  // fallback: dia da semana sem histórico herda a média geral dos dias úteis
  const uteis=arr.slice(1).filter(v=>v>0);
  const geral=uteis.length?uteis.reduce((a,b)=>a+b,0)/uteis.length:0;
  return arr.map((v,i)=>v>0?v:(i===0?0:geral));
}
// despesa média por dia de funcionamento que NÃO veio de agendamento/recorrência
function avgAvulsaOut(){
  const t=todayStr(),cut=addDaysISO(t,-89);
  let tot=0;
  S.lancamentos.forEach(l=>{
    if(l.status!=='liquidado')return;
    if(l.tipo!=='pagamento'&&l.tipo!=='prolabore')return;
    if(l.recId)return;
    if(l.data<cut||l.data>t)return;
    tot+=l.valor;
  });
  const e=earliestDataDate();
  const fromD=(e&&e>cut)?e:cut;
  let uteis=0;
  for(let d=fromD;d<=t;d=addDaysISO(d,1))if(new Date(d+'T12:00:00').getDay()!==0)uteis++;
  return uteis?tot/uteis:0;
}
function dailyRecStats(){
  const map=recByDateMap();
  const vals=Object.values(map).filter(v=>v>0);
  const mean=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
  const sd=vals.length>1?Math.sqrt(vals.reduce((a,b)=>a+Math.pow(b-mean,2),0)/(vals.length-1)):0;
  return{mean,sd,n:vals.length};
}

// ══ v7 · CURVA DE CAIXA ═════════════════════════════
// opts: {days, incluirVendas, incluirAvulsas, vendasDia(null=perfil por dia da semana),
//        avulsasDia(null=média), ajustePct, adiarDias, extraSaida, extraSaidaData}
function cashCurve(opts){
  const o=Object.assign({days:90,incluirVendas:true,incluirAvulsas:true,vendasDia:null,avulsasDia:null,ajustePct:0,adiarDias:0,extraSaida:0,extraSaidaData:null},opts||{});
  const wa=weekdayAvgRec();
  const avul=o.avulsasDia!=null?o.avulsasDia:avgAvulsaOut();
  const t=todayStr();
  // pendentes por data (vencidos caem em hoje; adiamento só afeta saídas)
  const pend={};
  S.lancamentos.forEach(l=>{
    if(l.status!=='pendente')return;
    let d=l.data<t?t:l.data;
    if(o.adiarDias&&l.tipo!=='recebimento')d=addDaysISO(d,o.adiarDias);
    (pend[d]=pend[d]||[]).push(l);
  });
  let saldo=calcCG();
  const pts=[];let critical=null,min=null;
  for(let i=0;i<=o.days;i++){
    const iso=addDaysISO(t,i);
    const wd=new Date(iso+'T12:00:00').getDay();
    let inflow=0,outflow=0,agIn=0,agOut=0;
    (pend[iso]||[]).forEach(l=>{if(l.tipo==='recebimento')agIn+=l.valor;else agOut+=l.valor;});
    inflow+=agIn;outflow+=agOut;
    if(i>0){
      if(o.incluirVendas){
        const base=(o.vendasDia!=null?(wd===0?0:o.vendasDia):wa[wd])*(1+o.ajustePct/100);
        inflow+=Math.max(0,base-agIn); // evita contar duas vezes o que já está agendado
      }
      if(o.incluirAvulsas&&wd!==0)outflow+=avul;
    }
    if(o.extraSaida&&o.extraSaidaData===iso)outflow+=o.extraSaida;
    saldo+=inflow-outflow;
    pts.push({iso,wd,saldo,inflow,outflow,agIn,agOut});
    if(saldo<0&&!critical&&i>0)critical={iso,saldo,dias:i};
    if(!min||saldo<min.saldo)min={iso,saldo,dias:i};
  }
  return{pts,critical,min,wa,avul,cg:calcCG()};
}

// ══ v7 · PREVISÃO DE FECHAMENTO DO MÊS ══════════════
function forecastMonth(){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth()+1,d=n.getDate();
  const dim=new Date(y,m,0).getDate();
  const wa=weekdayAvgRec();
  const real=statsRange(y,m,1,d,'real');
  let esperado=0,restDays=0;
  for(let dd=d+1;dd<=dim;dd++){esperado+=wa[new Date(y,m-1,dd).getDay()];restDays++;}
  const st=dailyRecStats();
  const band=st.sd*Math.sqrt(Math.max(1,restDays));
  // saídas: já liquidado + tudo agendado até o fim do mês
  const prog=statsRange(y,m,1,dim,'prog');
  const saidaProg=prog.pag+prog.pro;
  const recProv=real.rec+esperado;
  // comparação com o mesmo mês do ano anterior, se houver
  const ly=monthStats(y-1,m);
  return{
    y,m,d,dim,restDays,
    real:real.rec,esperado,
    prov:recProv,pess:real.rec+Math.max(0,esperado-band),otim:real.rec+esperado+band,
    saidaProg,saldoProv:recProv-saidaProg,
    lastYear:(ly.rec>0?ly.rec:null),
    confianca:st.n>=20?'alta':st.n>=8?'média':'baixa',n:st.n
  };
}

function setDashTab(t){
  dashTab=t;
  document.querySelectorAll('.itab').forEach(el=>el.classList.remove('active'));
  const tabs=document.querySelectorAll('.itab');
  ({insights:0,pizza:1,day:2})[t]!==undefined&&tabs[({insights:0,pizza:1,day:2})[t]]?.classList.add('active');
  const side=document.getElementById('dash-side');
  if(!side)return;
  if(t==='insights'){
    const{rec,pag,pro,saldo}=monthStats(fY,fM);
    const pmY=fM===1?fY-1:fY,pmM=fM===1?12:fM-1;
    const prev=monthStats(pmY,pmM);
    side.innerHTML=renderInsights(rec,pag,pro,saldo,prev,deltaPct(rec,prev.rec),deltaPct(pag,prev.pag));
  }else if(t==='pizza'){
    side.innerHTML=renderPizza();
  }else{
    side.innerHTML=renderDayPanel();
  }
}

function renderInsights(rec,pag,pro,saldo,prev,dRec,dPag){
  const topRec=topCategories('recebimento',fY,fM);
  const topPag=topCategories('pagamento',fY,fM);
  const maxR=topRec.length?topRec[0][1]:1;
  const maxP=topPag.length?topPag[0][1]:1;
  const today=new Date();
  const isCur=today.getFullYear()===fY&&today.getMonth()+1===fM;
  const dim=new Date(fY,fM,0).getDate();
  const dayElapsed=isCur?today.getDate():dim;
  const projSaldo=isCur&&dayElapsed>0?(saldo/dayElapsed)*dim:saldo;

  return `
    <div class="kpi-row">
      <div class="kpi"><div class="kpi-l">Recebido</div><div class="kpi-v" style="color:var(--teal)">${brlShort(rec)}</div>${dRec!==null?`<div class="kpi-d ${dRec>=0?'up':'down'}">${dRec>=0?'↑':'↓'} ${Math.abs(dRec).toFixed(0)}% vs mês ant.</div>`:'<div class="kpi-d" style="color:var(--muted)">—</div>'}</div>
      <div class="kpi"><div class="kpi-l">Pago</div><div class="kpi-v" style="color:var(--red)">${brlShort(pag)}</div>${dPag!==null?`<div class="kpi-d ${dPag<=0?'up':'down'}">${dPag>=0?'↑':'↓'} ${Math.abs(dPag).toFixed(0)}% vs mês ant.</div>`:'<div class="kpi-d" style="color:var(--muted)">—</div>'}</div>
      <div class="kpi"><div class="kpi-l">Pró-labore</div><div class="kpi-v" style="color:var(--purple)">${brlShort(pro)}</div><div class="kpi-d" style="color:var(--muted2)">no mês</div></div>
      <div class="kpi"><div class="kpi-l">Saldo do Mês</div><div class="kpi-v" style="color:${saldo>=0?'var(--teal)':'var(--red)'}">${brlShort(saldo)}</div>${isCur&&dayElapsed<dim?`<div class="kpi-d" style="color:var(--muted2)">proj: ${brlShort(projSaldo)}</div>`:'<div class="kpi-d" style="color:var(--muted)">—</div>'}</div>
    </div>
    ${topRec.length?`<div class="day-group-ttl"><span>TOP RECEBIMENTOS POR CATEGORIA</span></div>
    <div class="cat-list-mini">${topRec.map(([n,v])=>`<div class="cat-bar"><div class="cat-bar-top"><span class="cat-bar-name">${escapeHtml(n)}</span><span class="cat-bar-val">${brl(v)}</span></div><div class="cat-bar-track"><div class="cat-bar-fill" style="width:${(v/maxR)*100}%;background:var(--teal)"></div></div></div>`).join('')}</div>`:''}
    ${topPag.length?`<div class="day-group-ttl" style="margin-top:14px"><span>TOP PAGAMENTOS POR CATEGORIA</span></div>
    <div class="cat-list-mini">${topPag.map(([n,v])=>`<div class="cat-bar"><div class="cat-bar-top"><span class="cat-bar-name">${escapeHtml(n)}</span><span class="cat-bar-val">${brl(v)}</span></div><div class="cat-bar-track"><div class="cat-bar-fill" style="width:${(v/maxP)*100}%;background:var(--red)"></div></div></div>`).join('')}</div>`:''}
    ${!topRec.length&&!topPag.length?`<div class="day-empty"><div class="icon">📊</div>Nenhum lançamento liquidado neste mês ainda</div>`:''}`;
}

// ── INTELIGÊNCIA FINANCEIRA ───────────────────────────
function pad2i(n){return String(n).padStart(2,'0');}
function isoD(x){return x.getFullYear()+'-'+pad2i(x.getMonth()+1)+'-'+pad2i(x.getDate());}
function recByDateMap(){const m={};S.lancamentos.forEach(l=>{if(l.status==='liquidado'&&l.tipo==='recebimento')m[l.data]=(m[l.data]||0)+l.valor;});return m;}
function earliestDataDate(){let e=null;S.lancamentos.forEach(l=>{if(!e||l.data<e)e=l.data;});return e;}
// despesa média diária dos últimos 90 dias (liquidado: pagamentos + pró-labore)
function avgDailyOut90(){
  const t=todayStr();
  const c=new Date();c.setDate(c.getDate()-89);
  const cut=isoD(c);
  let tot=0;
  S.lancamentos.forEach(l=>{if(l.status==='liquidado'&&(l.tipo==='pagamento'||l.tipo==='prolabore')&&l.data>=cut&&l.data<=t)tot+=l.valor;});
  const e=earliestDataDate();
  let span=90;
  if(e&&e>cut)span=Math.max(1,daysBetween(e,t)+1);
  return{avg:tot/span,span,tot};
}
function intelHealth(){
  const n=new Date();const y=n.getFullYear(),m=n.getMonth()+1,d=n.getDate();
  const dim=new Date(y,m,0).getDate();
  const t=todayStr();
  const out=avgDailyOut90();
  const cg=calcCG();
  const runway=out.avg>0?cg/out.avg:null;
  // compromissos pendentes de hoje ao fim do mês
  let pagRest=0,recRest=0;
  S.lancamentos.forEach(l=>{
    if(l.status!=='pendente'||l.data<t)return;
    const dt=new Date(l.data+'T12:00:00');
    if(dt.getFullYear()!==y||dt.getMonth()+1!==m)return;
    if(l.tipo==='recebimento')recRest+=l.valor;else pagRest+=l.valor;
  });
  const utilRest=countUtilDays(y,m,d,dim)||1;
  const needDay=Math.max(0,pagRest-recRest)/utilRest;
  // % da receita comprometida: (pag+pro programados do mês) / receita projetada pelo ritmo
  const mReal=statsRange(y,m,1,dim,'real');
  const mProg=statsRange(y,m,1,dim,'prog');
  const elapsedU=countUtilDays(y,m,1,d)||1;
  const totalU=countUtilDays(y,m,1,dim)||1;
  const projRec=mReal.rec*(totalU/elapsedU);
  const commit=projRec>0?((mProg.pag+mProg.pro)/projRec)*100:null;
  return{out,cg,runway,pagRest,recRest,utilRest,needDay,projRec,commit,y,m,d,dim};
}
function last12Months(){
  const n=new Date();let y=n.getFullYear(),m=n.getMonth()+1;const arr=[];
  for(let i=0;i<12;i++){arr.unshift({y,m});m--;if(m===0){m=12;y--;}}
  return arr;
}
function weekdayPerf(){
  const map=recByDateMap();
  const agg=Array.from({length:7},()=>({tot:0,days:0}));
  Object.entries(map).forEach(([d,v])=>{if(v<=0)return;const wd=new Date(d+'T12:00:00').getDay();agg[wd].tot+=v;agg[wd].days++;});
  return agg;
}
function tagWeekdayCombos(){
  const map=recByDateMap();const combos={};
  const WD=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  Object.entries(S.dayTags||{}).forEach(([date,tags])=>{
    const v=map[date]||0;if(v<=0)return;
    const wd=WD[new Date(date+'T12:00:00').getDay()];
    (tags||[]).forEach(tg=>{const k=tg+' · '+wd;if(!combos[k])combos[k]={tot:0,days:0};combos[k].tot+=v;combos[k].days++;});
  });
  return Object.entries(combos).map(([k,c])=>({k,avg:c.tot/c.days,days:c.days}))
    .filter(c=>c.days>=2).sort((a,b)=>b.avg-a.avg).slice(0,6);
}
function intelAlerts(h){
  const A=[];const t=todayStr();
  // 1. vencidos
  let ovC=0,ovV=0;
  S.lancamentos.forEach(l=>{if(l.status==='pendente'&&l.tipo!=='recebimento'&&l.data<t){ovC++;ovV+=l.valor;}});
  if(ovC)A.push({cls:'red',icon:'⚠️',txt:`<strong>${ovC} pagamento${ovC>1?'s':''} vencido${ovC>1?'s':''}</strong> somando <strong>${brl(ovV)}</strong>. Regularize ou reagende para não distorcer as análises.`});
  // 2. concentração de vencimentos (4 janelas de 7 dias)
  let worst={tot:0,as:null,bs:null};
  for(let w=0;w<4;w++){
    const a=new Date();a.setDate(a.getDate()+w*7);
    const b=new Date();b.setDate(b.getDate()+w*7+6);
    const as=isoD(a),bs=isoD(b);
    let tot=0;S.lancamentos.forEach(l=>{if(l.status==='pendente'&&l.tipo!=='recebimento'&&l.data>=as&&l.data<=bs)tot+=l.valor;});
    if(tot>worst.tot)worst={tot,as,bs};
  }
  if(worst.tot>0&&h.out.avg>0&&worst.tot>h.out.avg*7*1.4)
    A.push({cls:'',icon:'📆',txt:`A semana de <strong>${worst.as.slice(8,10)}/${worst.as.slice(5,7)} a ${worst.bs.slice(8,10)}/${worst.bs.slice(5,7)}</strong> concentra <strong>${brl(worst.tot)}</strong> em vencimentos — bem acima da sua média semanal de saída (${brl(h.out.avg*7)}). Reserve caixa.`});
  // 3. categorias de gasto acima da média (3 meses anteriores, realizado)
  const curCats=catMapRange('pagamento',h.y,h.m,1,h.dim,'prog');
  const hist={};
  for(let i=1;i<=3;i++){
    let mm=h.m-i,yy=h.y;while(mm<=0){mm+=12;yy--;}
    const dd=new Date(yy,mm,0).getDate();
    Object.entries(catMapRange('pagamento',yy,mm,1,dd,'real')).forEach(([k,v])=>{(hist[k]=hist[k]||[]).push(v);});
  }
  Object.entries(curCats).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>{
    const hh=hist[k];if(!hh||!hh.length)return;
    const avg=hh.reduce((a,b)=>a+b,0)/hh.length;
    if(avg>0&&v>avg*1.3&&(v-avg)>100)
      A.push({cls:'',icon:'📈',txt:`<strong>${escapeHtml(k)}</strong>: ${brl(v)} programado neste mês vs média de ${brl(avg)} nos últimos 3 meses (<strong>+${(((v-avg)/avg)*100).toFixed(0)}%</strong>). Confira se é pontual ou tendência.`});
  });
  // 4. receita vs mesmo período do mês anterior
  const pm=h.m===1?12:h.m-1,py=h.m===1?h.y-1:h.y;
  const dimP=new Date(py,pm,0).getDate();
  const curR=statsRange(h.y,h.m,1,h.d,'real').rec;
  const prevR=statsRange(py,pm,1,Math.min(h.d,dimP),'real').rec;
  if(prevR>0&&curR<prevR*0.9)A.push({cls:'red',icon:'📉',txt:`Recebimentos até o dia ${h.d} estão <strong>${(100-(curR/prevR)*100).toFixed(0)}% abaixo</strong> do mesmo período do mês passado (${brl(curR)} vs ${brl(prevR)}).`});

function renderAdvStats(){
  const today=new Date();
  const isCur=today.getFullYear()===fY&&today.getMonth()+1===fM;
  const dimCur=new Date(fY,fM,0).getDate();
  const cutoffCur=isCur?today.getDate():dimCur; // até hoje (mês atual) ou mês fechado (histórico)
  const pmY=fM===1?fY-1:fY,pmM=fM===1?12:fM-1;
  const dimPrev=new Date(pmY,pmM,0).getDate();
  const base=advStatsBase; // 'real' | 'prog'
  const prog=base==='prog';
  const prevFull=monthStats(pmY,pmM); // mês anterior fechado (realizado)
  const p2=n=>String(n).padStart(2,'0');

  // define a janela conforme a base/modo
  // PROGRAMADO => mês inteiro (pega agendados futuros). REALIZADO => até hoje (comparação justa).
  let curTo,prevTo,utilCur,utilPrev,curLabel,prevLabel,daysLbl;
  if(prog){
    curTo=dimCur; prevTo=dimPrev;
    curLabel=`${MONTHS[fM-1].slice(0,3)} inteiro (01–${p2(dimCur)})`;
    prevLabel=`${MONTHS[pmM-1].slice(0,3)} inteiro`;
    daysLbl='mês inteiro · realizado + agendado';
  }else if(advStatsMode==='util'){
    curTo=cutoffCur;
    utilCur=countUtilDays(fY,fM,1,cutoffCur);
    prevTo=dayForUtilCount(pmY,pmM,utilCur);
    utilPrev=countUtilDays(pmY,pmM,1,prevTo);
    curLabel=`01–${p2(cutoffCur)}/${MONTHS[fM-1].slice(0,3)}`;
    prevLabel=`01–${p2(prevTo)}/${MONTHS[pmM-1].slice(0,3)}`;
    daysLbl=`${utilCur} dias úteis (seg–sáb)`;
  }else{
    curTo=cutoffCur;
    prevTo=Math.min(cutoffCur,dimPrev);
    curLabel=`01–${p2(cutoffCur)}/${MONTHS[fM-1].slice(0,3)}`;
    prevLabel=`01–${p2(prevTo)}/${MONTHS[pmM-1].slice(0,3)}`;
    daysLbl=`${cutoffCur} dia${cutoffCur>1?'s':''} corrido${cutoffCur>1?'s':''}`;
  }

  const cur=statsRange(fY,fM,1,curTo,base);
  const prev=statsRange(pmY,pmM,1,prevTo,base);

  // agendado (não liquidado) dentro da janela mostrada = prog - real
  const realWin=statsRange(fY,fM,1,curTo,'real');
  const progWin=statsRange(fY,fM,1,curTo,'prog');
  const pendRec=progWin.rec-realWin.rec, pendPag=progWin.pag-realWin.pag, pendPro=progWin.pro-realWin.pro;
  const hasPend=(pendRec+pendPag+pendPro)>0.005;

  // ritmo diário (só no modo Realizado — usa dias decorridos)
  const divCur=advStatsMode==='util'?(utilCur||1):cutoffCur;
  const divPrev=advStatsMode==='util'?(utilPrev||1):prevTo;
  const paceCur=cur.rec/(divCur||1),pacePrev=prev.rec/(divPrev||1);

  // cards KPI
  const card=(label,curV,prevV,goodUp,color,sub)=>`
    <div class="adv-card">
      <div class="cl">${label}</div>
      <div class="cv" style="color:${color}">${brl(curV)}</div>
      <div class="cc">${sub?sub+'<br>':''}ant.: ${brl(prevV)} · ${advDelta(curV,prevV,goodUp)}</div>
    </div>`;

  // comparativo por categoria (respeita a base e a janela)
  const catBlock=(tipo,titulo,goodUp,color)=>{
    const mc=catMapRange(tipo,fY,fM,1,curTo,base);
    const mp=catMapRange(tipo,pmY,pmM,1,prevTo,base);
    const keys=[...new Set([...Object.keys(mc),...Object.keys(mp)])].sort((a,b)=>(mc[b]||0)-(mc[a]||0));
    if(!keys.length)return '';
    return `<div class="adv-sec-ttl" style="color:${color}">${titulo}</div>

        <span class="av" style="color:${color}">${brl(c)}</span>

        <span class="ad">${advDelta(c,p,goodUp)}</span>
      </div>`;}).join('')}`;
  };

  // faixa de agendados
  const pendStrip=hasPend?`<div class="adv-pend">📋 ${prog?'Do total acima, ainda <strong>não liquidado</strong> (agendado):':'Além do realizado acima, já há <strong>agendado</strong> neste período:'} recebimentos <strong style="color:var(--teal)">${brl(pendRec)}</strong> · pagamentos <strong style="color:var(--red)">${brl(pendPag)}</strong>${pendPro>0.005?` · pró-labore <strong style="color:var(--purple)">${brl(pendPro)}</strong>`:''}</div>`:'';

  // projeção de recebimento pelo ritmo (venda futura não costuma estar agendada)
  const totalDivCur=advStatsMode==='util'?countUtilDays(fY,fM,1,dimCur):dimCur;
  const elapsedDiv=advStatsMode==='util'?countUtilDays(fY,fM,1,cutoffCur):cutoffCur;
  const paceProjRec=realWin.rec*(totalDivCur/(prog?elapsedDiv:divCur||1));
  const paceNote=isCur?`<div class="adv-pend" style="background:rgba(0,212,160,.06);border-color:rgba(0,212,160,.2);margin-top:11px">📈 Se as vendas seguirem o ritmo atual, o recebimento do mês tende a <strong style="color:var(--teal)">${brl(realWin.rec*(totalDivCur/(elapsedDiv||1)))}</strong> — normalmente acima do agendado, porque vendas futuras raramente estão lançadas como pendentes.</div>`:'';

  // 🔮 Projeção de fechamento (só no modo Realizado; no Programado os cards já mostram o mês inteiro)
  let closingHtml='';
  if(!prog){
    if(isCur){
      const mProg=statsRange(fY,fM,1,dimCur,'prog');
      const mReal=statsRange(fY,fM,1,dimCur,'real');

      closingHtml=`<div class="adv-proj">
        <div class="adv-sec-ttl" style="margin-top:0">🔮 Como o mês deve fechar vs mês anterior</div>
        <div style="font-size:11px;color:var(--muted2);margin-bottom:10px">Mês atual = já realizado <strong>+</strong> agendado (mês inteiro), comparado com o mês anterior já fechado.</div>
        <div class="adv-grid">
          <div class="adv-card" style="background:transparent"><div class="cl">Recebimentos do mês</div><div class="cv" style="color:var(--teal)">${brl(mProg.rec)}</div><div class="cc">realizado ${brl(mReal.rec)} + agendado ${brl(agRec)}<br>mês ant.: ${brl(prevFull.rec)} · ${advDelta(mProg.rec,prevFull.rec,true)}</div></div>
          <div class="adv-card" style="background:transparent"><div class="cl">Pagamentos do mês</div><div class="cv" style="color:var(--red)">${brl(mProg.pag)}</div><div class="cc">realizado ${brl(mReal.pag)} + agendado ${brl(agPag)}<br>mês ant.: ${brl(prevFull.pag)} · ${advDelta(mProg.pag,prevFull.pag,false)}</div></div>
          <div class="adv-card" style="background:transparent"><div class="cl">Pró-labore do mês</div><div class="cv" style="color:var(--purple)">${brl(mProg.pro)}</div><div class="cc">realizado ${brl(mReal.pro)} + agendado ${brl(agPro)}<br>mês ant.: ${brl(prevFull.pro)}</div></div>
          <div class="adv-card" style="background:transparent"><div class="cl">Saldo do mês (projetado)</div><div class="cv" style="color:${mProg.saldo>=0?'var(--teal)':'var(--red)'}">${brl(mProg.saldo)}</div><div class="cc">mês ant.: ${brl(prevFull.saldo)} · ${advDelta(mProg.saldo,prevFull.saldo,true)}</div></div>
        </div>
        ${paceNote}
      </div>`;
    }else{
      closingHtml=`<div class="adv-note">📁 Mês fechado — a projeção de fechamento só aparece no mês corrente.</div>`;
    }
  }

  return `
    <div class="adv-toggle">
      <button class="${!prog?'active':''}" onclick="setAdvBase('real')">✅ Realizado</button>
      <button class="${prog?'active prog':''}" onclick="setAdvBase('prog')">📋 Programado (mês todo)</button>
    </div>
    ${!prog?`<div class="adv-toggle">
      <button class="${advStatsMode==='dia'?'active':''}" onclick="setAdvMode('dia')">📅 Por dia do mês</button>
      <button class="${advStatsMode==='util'?'active':''}" onclick="setAdvMode('util')">🏪 Por dias úteis</button>
    </div>`:''}

    <div class="adv-period">
      <span><span class="pl">Atual:</span> <span class="pv">${curLabel}</span></span>
      <span><span class="pl">Anterior:</span> <span class="pv">${prevLabel}</span></span>
      <span><span class="pl">Base:</span> <span class="pv">${daysLbl}</span></span>
    </div>

    <div class="adv-grid">
      ${card(prog?'Recebido + agendado':'Recebido no período',cur.rec,prev.rec,true,'var(--teal)',prog?`realizado ${brl(realWin.rec)} + agendado ${brl(pendRec)}`:'')}
      ${card(prog?'Pago + agendado':'Pago no período',cur.pag,prev.pag,false,'var(--red)',prog?`realizado ${brl(realWin.pag)} + agendado ${brl(pendPag)}`:'')}
      ${card('Pró-labore',cur.pro,prev.pro,false,'var(--purple)',prog&&pendPro>0.005?`realizado ${brl(realWin.pro)} + agendado ${brl(pendPro)}`:'')}
      ${card(prog?'Saldo do mês (projetado)':'Saldo do período',cur.saldo,prev.saldo,true,cur.saldo>=0?'var(--teal)':'var(--red)')}
    </div>
    ${!prog?pendStrip:''}

    ${!prog?`<div class="adv-sec-ttl">⚡ Ritmo diário de recebimento</div>

    ${closingHtml}

    <div class="adv-note">
      <strong>Realizado</strong> = só liquidados, comparando o mesmo período do mês anterior (até hoje). <strong>Programado (mês todo)</strong> = liquidado + agendados do mês inteiro, incluindo boletos e recebimentos com data futura, contra o mês anterior inteiro.

function renderPie({items,total}){
  if(total===0)return'';
  const cx=55,cy=55,r=42,ir=26;
  let acc=0;
  const slices=items.map(([name,v],i)=>{
    const start=(acc/total)*Math.PI*2-Math.PI/2;
    acc+=v;
    const end=(acc/total)*Math.PI*2-Math.PI/2;
    const large=end-start>Math.PI?1:0;
    const x1=cx+r*Math.cos(start),y1=cy+r*Math.sin(start);
    const x2=cx+r*Math.cos(end),y2=cy+r*Math.sin(end);
    const x3=cx+ir*Math.cos(end),y3=cy+ir*Math.sin(end);
    const x4=cx+ir*Math.cos(start),y4=cy+ir*Math.sin(start);
    const path=`M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${ir} ${ir} 0 ${large} 0 ${x4} ${y4} Z`;
    return{path,color:PIE[i%PIE.length],name,v,pct:(v/total)*100};
  });
  return `<div class="pizza-wrap">
    <svg class="pizza-svg" width="110" height="110" viewBox="0 0 110 110">
      ${slices.map(s=>`<path d="${s.path}" fill="${s.color}" stroke="var(--s1)" stroke-width="1.5"><title>${escapeHtml(s.name)}: ${brl(s.v)} (${s.pct.toFixed(1)}%)</title></path>`).join('')}
      <text x="${cx}" y="${cy-3}" class="pizza-center">${items.length} cat.</text>
      <text x="${cx}" y="${cy+11}" class="pizza-center-v">${brlShort(total)}</text>
    </svg>
    <div class="pizza-legend">
      ${slices.map(s=>`<div class="pizza-leg"><span class="pizza-leg-dot" style="background:${s.color}"></span><span class="pizza-leg-name">${escapeHtml(s.name)}</span><span class="pizza-leg-pct">${s.pct.toFixed(1)}%</span></div>`).join('')}
    </div>
  </div>`;
}

function dayTagBlock(date){
  const on=dayTagsFor(date);
  const chips=S.tagLibrary.map((t,i)=>`<span class="daytag ${on.includes(t)?'on':''}" onclick="toggleDayTagUI('${date}',${i})">${escapeHtml(t)}</span>`).join('');
  return `<div class="daytag-wrap">
    <div class="daytag-ttl">🏷️ Condições do dia</div>
    <div class="daytag-chips">${chips||'<span style="color:var(--muted);font-size:11px">Nenhuma tag — cadastre em Avançado › Condições</span>'}</div>
  </div>`;
}
function toggleDayTagUI(date,idx){const t=S.tagLibrary[idx];if(t==null)return;toggleDayTag(date,t);const s=document.getElementById('dash-side');if(s)s.innerHTML=renderDayPanel();}
function renderDayPanel(){
  if(!selectedDay)return`<div class="day-empty"><div class="icon">📅</div>Clique em um dia no calendário para ver os lançamentos</div>`;
  const lancs=S.lancamentos.filter(l=>l.data===selectedDay);
  if(lancs.length===0)return`<div class="day-header">${fmtDate(selectedDay)}</div><div class="day-sub">Nenhum lançamento neste dia</div>${dayTagBlock(selectedDay)}<div class="day-empty" style="margin-top:12px"><div class="icon">📭</div><div class="qa-dupla"><button class="btn btn-d btn-sm" onclick="quickAddOnDay('${selectedDay}','pagamento')">📤 Lançar pagamento</button><button class="btn btn-s btn-sm" onclick="quickAddOnDay('${selectedDay}','recebimento')">💰 Lançar recebimento</button></div></div>`;
  const liq=l=>l.status==='liquidado';
  const rec=sum(lancs.filter(l=>l.tipo==='recebimento'&&liq(l)));
  const pag=sum(lancs.filter(l=>l.tipo==='pagamento'&&liq(l)));
  const pro=sum(lancs.filter(l=>l.tipo==='prolabore'&&liq(l)));
  const saldoLiq=rec-pag-pro;
  const pen=lancs.filter(l=>!liq(l));
  const grp=(t,lbl,c)=>{
    const its=lancs.filter(l=>l.tipo===t);
    if(!its.length)return'';
    return`<div class="day-group-ttl"><span>${lbl}</span></div>${its.map(l=>{
      const ov=isOverdue(l);
      return`<div class="day-item ${l.status==='pendente'?'pending':''}">
        <span class="day-item-info" title="${l.status==='pendente'?(ov?'⚠️ Vencido':'⏳ Agendado'):'✓ Liquidado'}">
          ${l.status==='pendente'?(ov?'<span style="color:var(--red)">⚠</span> ':'<span style="color:var(--orange)">⏳</span> '):''}
          ${escapeHtml(l.categoria)}${l.descricao?' · '+escapeHtml(l.descricao):''}
        </span>
        <span class="day-item-val ${l.status==='pendente'?'pen':''}" style="color:${c}">${brl(l.valor)}</span>
        ${l.status==='pendente'?`<button class="day-quick-liq" onclick="quickLiquidate('${l.id}')">✓</button>`:''}
      </div>`;
    }).join('')}`;
  };
  return `<div class="day-header">${fmtDate(selectedDay)}</div>
    <div class="day-sub">${lancs.length} lançamento${lancs.length>1?'s':''} ${pen.length?`· <span style="color:var(--orange)">${pen.length} agendado${pen.length>1?'s':''}</span>`:''}</div>
    ${grp('recebimento','RECEBIMENTOS','var(--teal)')}
    ${grp('pagamento','PAGAMENTOS','var(--red)')}
    ${grp('prolabore','PRÓ-LABORE','var(--purple)')}
    <div class="day-total"><span>Saldo liquidado</span><span style="color:${saldoLiq>=0?'var(--teal)':'var(--red)'}">${saldoLiq>=0?'+':''}${brl(saldoLiq)}</span></div>
    ${dayTagBlock(selectedDay)}
    <div class="qa-dupla" style="margin-top:12px">
      <button class="btn btn-d btn-sm" onclick="quickAddOnDay('${selectedDay}','pagamento')">📤 Lançar pagamento</button>
      <button class="btn btn-s btn-sm" onclick="quickAddOnDay('${selectedDay}','recebimento')">💰 Lançar recebimento</button>
    </div>`;
}

function quickAddOnDay(date,tipoEscolhido){
  // O tipo vem do botão clicado (pagamento/recebimento); sem botão, repete o
  // último usado. O status é a data quem decide: dia futuro só pode ser
  // agendado, hoje ou para trás já entra como liquidado.
  const ult=S.ultimoLanc||{};
  const tipoIni=tipoEscolhido||ult.tipo||'recebimento';
  const futuro=date>todayStr();
  const statusIni=futuro?'pendente':'liquidado';
  const op=(v,rot)=>`<option value="${v}" ${tipoIni===v?'selected':''}>${rot}</option>`;
  showModal('Adicionar lançamento',`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
      <div class="fg"><label>Tipo</label><select id="qa-tipo" onchange="updateQuickCat()">
        ${op('recebimento','💰 Recebimento')}${op('pagamento','📤 Pagamento')}${op('prolabore','👤 Pró-labore')}</select></div>
      <div class="fg"><label>Data</label><input id="qa-data" type="date" value="${date}" onchange="ajustaStatusPelaData()"></div>
    </div>
    <div class="fg" style="margin-bottom:10px"><label>Categoria</label><select id="qa-cat"></select></div>
    <div class="fg" style="margin-bottom:10px"><label>Descrição</label><input id="qa-desc" type="text" placeholder="NF 1234, conta de luz..."></div>
    <div class="fg" style="margin-bottom:6px"><label>Valor (R$)</label><input id="qa-val" type="text" inputmode="decimal" placeholder="0,00 ou 120,50+89,90" oninput="somaBoletosQa()" title="Vários boletos do mesmo fornecedor: separe por + (ex.: 120,50+89,90+45)"></div>
    <div class="boletos-linha" style="margin-bottom:10px">
      <label class="boletos-chk" title="Marcado: cada boleto vira um lançamento. Desmarcado: entra um só, com a soma.">
        <input type="checkbox" id="qa-separar" onchange="somaBoletosQa()">
        <span>Lançar cada boleto separado</span>
      </label>
      <span class="boletos-resumo" id="qa-resumo">Vários boletos? Separe por <b>+</b>: <code>120,50+89,90</code></span>
    </div>
    <div class="fg"><label>Status</label>
      <div class="status-toggle">
        <button class="${statusIni==='liquidado'?'active liq':''}" data-st="liquidado" onclick="setQaStatus(this,'liquidado')">✓ Liquidado</button>
        <button class="${statusIni==='pendente'?'active pen':''}" data-st="pendente" onclick="setQaStatus(this,'pendente')">⏳ Agendado</button>
      </div>
      <div id="qa-dica" style="font-size:11px;color:var(--muted2);margin-top:6px">${futuro?'Data futura — já marcado como agendado.':''}</div>
    </div>
  `,[{label:'Cancelar',cls:'btn-g',fn:closeModal},{label:'Adicionar',cls:'btn-t',fn:saveQuickAdd}]);
  setTimeout(()=>{updateQuickCat(ult.categoria);document.getElementById('qa-val')?.focus();},50);
}

// nas páginas de Recebimentos/Pagamentos: escolher data futura já marca agendado
function ajustaStatusPagina(input){
  if(!input.value||input.value<=todayStr())return;
  const form=input.closest('.form-card');
  const bt=form?.querySelector('.status-toggle button[data-st="pendente"]');
  if(bt&&!bt.classList.contains('active'))setLancStatus(bt,'pendente');
}

// data futura força "agendado"; voltando para hoje/passado libera "liquidado"
function ajustaStatusPelaData(){
  const d=document.getElementById('qa-data')?.value;
  const dica=document.getElementById('qa-dica');
  if(!d)return;
  const bts=document.querySelectorAll('#modal .status-toggle button');
  if(d>todayStr()){
    bts.forEach(b=>{if(b.dataset.st==='pendente')setQaStatus(b,'pendente');});
    if(dica)dica.textContent='Data futura — já marcado como agendado.';
  }else{
    // voltou para hoje ou para trás: não faz sentido seguir agendado
    bts.forEach(b=>{if(b.dataset.st==='liquidado')setQaStatus(b,'liquidado');});
    if(dica)dica.textContent='Hoje ou data passada — já marcado como liquidado.';
  }
}
/* Mesmo resumo da tela de Pagamentos, mas lendo os campos do modal do calendário. */
function somaBoletosQa(){
  const el = document.getElementById('qa-val');
  const out = document.getElementById('qa-resumo');
  if (!el || !out) return;
  const vals = parseValores(el.value);
  if (vals.length < 2) {
    out.classList.remove('ativo');
    out.innerHTML = 'Vários boletos? Separe por <b>+</b>: <code>120,50+89,90</code>';
    return;
  }
  const total = vals.reduce((a, b) => a + b, 0);
  const separar = !!document.getElementById('qa-separar')?.checked;
  out.classList.add('ativo');
  out.innerHTML = separar
    ? `${vals.length} boletos · <b>${brl(total)}</b> — ${vals.length} lançamentos`
    : `${vals.length} boletos · <b>${brl(total)}</b> — 1 lançamento somado`;
}

function setQaStatus(btn,st){btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active','liq','pen'));btn.classList.add('active',st==='liquidado'?'liq':'pen');btn.dataset.cur=st;btn.parentElement.dataset.value=st;}
function saveQuickAdd(){
  const tipo=document.getElementById('qa-tipo').value;
  const cat=tipo==='prolabore'?'Pró-labore':document.getElementById('qa-cat').value;
  const desc=document.getElementById('qa-desc').value.trim();
  const valores=parseValores(document.getElementById('qa-val').value);
  const val=valores.reduce((a,b)=>a+b,0);
  const data=document.getElementById('qa-data').value;
  const stEl=document.querySelector('#modal .status-toggle button.active');
  const status=stEl?stEl.dataset.st:'liquidado';
  if(!valores.length||!val||val<=0||!data){toast('⚠️ Preencha valor e data.');return;}
  const prev=calcCG();
  const separar=!!document.getElementById('qa-separar')?.checked;
  if(valores.length>1&&separar){
    valores.forEach((v,i)=>S.lancamentos.push({id:uid(),tipo,categoria:cat,
      descricao:(desc?desc+' ':'')+`(${i+1}/${valores.length})`,valor:v,data,status,
      dataLiq:status==='liquidado'?data:null}));
  }else{
    S.lancamentos.push({id:uid(),tipo,categoria:cat,
      descricao:valores.length>1?(desc?desc+' ':'')+`(${valores.length} boletos)`:desc,
      valor:val,data,status,dataLiq:status==='liquidado'?data:null});
  }
  // guarda a escolha para o próximo lançamento já abrir do mesmo jeito
  S.ultimoLanc={tipo,status,categoria:cat};
  save();closeModal();
  selectedDay=data;dashTab='day';render('dashboard');
  const el=document.getElementById('cg-display');if(el)animateTo(el,prev,calcCG());
  refreshSidebarBadges();
  toast(valores.length>1
    ? (separar ? `✓ ${valores.length} lançamentos criados · total ${brl(val)}`
               : `✓ ${valores.length} boletos somados em ${brl(val)}`)
    : (status==='liquidado'?'✓ Lançamento adicionado':'⏳ Agendado para '+fmtDate(data)));
}
function updateQuickCat(preferida){
  const t=document.getElementById('qa-tipo').value;
  const sel=document.getElementById('qa-cat');
  if(t==='prolabore'){sel.innerHTML='<option>Pró-labore</option>';sel.disabled=true;return;}
  const cats=S.categories[t==='recebimento'?'recebimentos':'pagamentos'];
  sel.innerHTML=cats.map(c=>`<option>${escapeHtml(c)}</option>`).join('');
  sel.disabled=false;
  // repete a última categoria usada, se ela existir neste tipo
  if(preferida&&cats.includes(preferida))sel.value=preferida;
}

// ── CALENDAR ─────────────────────────────────────────
function buildCalendar(year,month){
  const dim=new Date(year,month,0).getDate();
  const firstDow=new Date(year,month-1,1).getDay();
  const offset=(firstDow+6)%7;
  const today=new Date();
  const isNow=today.getFullYear()===year&&today.getMonth()+1===month;
  const dd={};let maxDay=0;
  S.lancamentos.forEach(l=>{
    const d=new Date(l.data+'T12:00:00');
    if(d.getFullYear()===year&&d.getMonth()+1===month){
      const k=d.getDate();
      if(!dd[k])dd[k]={rec:0,pag:0,pro:0,recP:0,pagP:0,proP:0,hasOver:false,hasPen:false};
      const liq=l.status==='liquidado';
      const ov=isOverdue(l);
      if(!liq){dd[k].hasPen=true;if(ov)dd[k].hasOver=true;}
      const key=l.tipo==='recebimento'?(liq?'rec':'recP'):l.tipo==='pagamento'?(liq?'pag':'pagP'):(liq?'pro':'proP');
      dd[k][key]+=l.valor;
      const tot=dd[k].rec+dd[k].pag+dd[k].pro+dd[k].recP+dd[k].pagP+dd[k].proP;
      if(tot>maxDay)maxDay=tot;
    }
  });
  let h=`<div class="cal-grid">`;
  ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].forEach(d=>h+=`<div class="cal-dow">${d}</div>`);
  for(let i=0;i<offset;i++)h+=`<div class="cal-day empty-day"></div>`;
  for(let d=1;d<=dim;d++){
    const ds=dd[d];
    const isToday=isNow&&today.getDate()===d;
    const dateStr=`${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isSelected=selectedDay===dateStr;
    let cls='cal-day';
    if(isToday)cls+=' today';
    if(isSelected)cls+=' selected';
    if(!ds)cls+=' empty-day-data';
    if(ds&&ds.hasOver)cls+=' has-overdue';
    else if(ds&&ds.hasPen)cls+=' has-pending';
    let bars='';
    if(ds&&maxDay>0){
      const norm=v=>Math.max(2,(v/maxDay)*16);
      const totR=ds.rec+ds.recP,totP=ds.pag+ds.pagP,totPro=ds.pro+ds.proP;
      bars=`<div class="cal-bars">
        ${totR>0?`<div class="cal-bar cal-bar-r ${ds.rec===0?'pen':''}" style="height:${norm(totR)}px"></div>`:''}
        ${totP>0?`<div class="cal-bar cal-bar-p ${ds.pag===0?'pen':''}" style="height:${norm(totP)}px"></div>`:''}
        ${totPro>0?`<div class="cal-bar cal-bar-pro ${ds.pro===0?'pen':''}" style="height:${norm(totPro)}px"></div>`:''}
      </div>`;
    }
    const netLiq=ds?(ds.rec-ds.pag-ds.pro):0;
    const netAll=ds?((ds.rec+ds.recP)-(ds.pag+ds.pagP)-(ds.pro+ds.proP)):0;
    const showNet=netLiq!==0?netLiq:netAll;
    const isPenOnly=netLiq===0&&netAll!==0;
    h+=`<div class="${cls}" id="cal-${d}" onclick="selectDay('${dateStr}')">
      <div class="cal-num-row">
        <span class="cal-num">${d}</span>
        ${(S.dayTags&&S.dayTags[dateStr]||[]).length?`<span class="cal-tagdot" title="${escapeHtml((S.dayTags[dateStr]||[]).join(', '))}">🏷</span>`:''}
        ${ds&&showNet!==0?`<span class="cal-net ${isPenOnly?'pen':''}" style="color:${showNet>=0?'var(--teal)':'var(--red)'}">${brlShort(showNet)}</span>`:''}
      </div>
      ${bars}
    </div>`;
  }
  h+=`</div>`;
  return h;
}

function selectDay(dateStr){
  if(selectedDay){const prev=parseInt(selectedDay.split('-')[2]);document.getElementById('cal-'+prev)?.classList.remove('selected');}
  selectedDay=dateStr;
  document.getElementById('cal-'+parseInt(dateStr.split('-')[2]))?.classList.add('selected');
  dashTab='day';
  setDashTab('day');
}

// ── CHART ─────────────────────────────────────────────
let _chartData=null;
function drawChart(year,month){
  const canvas=document.getElementById('cfchart');
  if(!canvas)return;
  const dpr=window.devicePixelRatio||1;
  const W=canvas.clientWidth,H=canvas.clientHeight;
  if(!W||!H)return;
  canvas.width=W*dpr;canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  const PAD={t:14,r:60,b:30,l:14};
  const cW=W-PAD.l-PAD.r,cH=H-PAD.t-PAD.b;
  const midY=PAD.t+cH*0.55;
  const dim=new Date(year,month,0).getDate();
  const today=new Date();
  const isNow=today.getFullYear()===year&&today.getMonth()+1===month;
  const days=Array.from({length:dim},(_,i)=>{
    const ds=`${year}-${String(month).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;
    const dayLancs=S.lancamentos.filter(l=>l.data===ds);
    const liq=dayLancs.filter(l=>l.status==='liquidado');
    const all=dayLancs;
    const recL=sum(liq.filter(l=>l.tipo==='recebimento'));
    const pagL=sum(liq.filter(l=>l.tipo==='pagamento'));
    const proL=sum(liq.filter(l=>l.tipo==='prolabore'));
    const recA=sum(all.filter(l=>l.tipo==='recebimento'));
    const pagA=sum(all.filter(l=>l.tipo==='pagamento'));
    const proA=sum(all.filter(l=>l.tipo==='prolabore'));
    return{day:i+1,date:ds,rec:recL,pag:pagL,pro:proL,out:pagL+proL,net:recL-pagL-proL,recA,pagA,proA,outA:pagA+proA,netA:recA-pagA-proA};
  });
  const cgStart=cgAtStartOfMonth(year,month);
  let runL=cgStart,runA=cgStart;
  const cumLiq=[cgStart],cumAll=[cgStart];
  days.forEach(d=>{runL+=d.net;cumLiq.push(runL);runA+=d.netA;cumAll.push(runA);});
  const maxBar=Math.max(...days.map(d=>Math.max(d.recA,d.outA)),1);
  const barUp=(cH*0.4)/maxBar,barDn=(cH*0.32)/maxBar;
  const cumMin=Math.min(...cumLiq,...cumAll),cumMax=Math.max(...cumLiq,...cumAll);
  const cumRange=Math.max(cumMax-cumMin,1)*1.3;
  const cumMid=(cumMin+cumMax)/2;
  const lineMidY=PAD.t+cH*0.42;
  const lineScale=(cH*0.7)/cumRange;
  const cumToY=v=>lineMidY-(v-cumMid)*lineScale;
  const slotW=cW/dim;
  const barW=Math.max(Math.min(slotW*0.55,16),4);

  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;
  for(let i=0;i<=3;i++){const y=PAD.t+(cH/3)*i;ctx.beginPath();ctx.moveTo(PAD.l,y);ctx.lineTo(PAD.l+cW,y);ctx.stroke();}

  // bars: liquidado opaco, pendente translúcido empilhado
  days.forEach((d,i)=>{
    const cx=PAD.l+(i+0.5)*slotW;
    // Recebimentos
    if(d.recA>0){
      const liqH=d.rec*barUp;
      const totH=d.recA*barUp;
      const x=cx-barW/2;
      // pendente atrás
      if(d.recA>d.rec){
        ctx.fillStyle='rgba(0,212,160,.22)';
        ctx.fillRect(x,midY-totH,barW,totH-liqH);
      }
      if(liqH>0){ctx.fillStyle='rgba(0,212,160,.65)';ctx.fillRect(x,midY-liqH,barW,liqH);}
    }
    // Saidas
    if(d.outA>0){
      const liqH=d.out*barDn,totH=d.outA*barDn;
      const x=cx-barW/2;
      if(d.outA>d.out){ctx.fillStyle='rgba(255,79,106,.22)';ctx.fillRect(x,midY+liqH,barW,totH-liqH);}
      if(liqH>0){ctx.fillStyle='rgba(255,79,106,.65)';ctx.fillRect(x,midY,barW,liqH);}
    }
  });
  // zero
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;ctx.setLineDash([5,5]);
  ctx.beginPath();ctx.moveTo(PAD.l,midY);ctx.lineTo(PAD.l+cW,midY);ctx.stroke();
  ctx.setLineDash([]);
  // CG area
  const aG=ctx.createLinearGradient(0,PAD.t,0,PAD.t+cH);
  aG.addColorStop(0,'rgba(0,212,160,.18)');aG.addColorStop(1,'rgba(0,212,160,0)');
  ctx.beginPath();ctx.moveTo(PAD.l,cumToY(cgStart));
  for(let i=0;i<dim;i++)ctx.lineTo(PAD.l+(i+0.5)*slotW,cumToY(cumLiq[i+1]));
  ctx.lineTo(PAD.l+(dim-0.5)*slotW,H-PAD.b);ctx.lineTo(PAD.l,H-PAD.b);ctx.closePath();
  ctx.fillStyle=aG;ctx.fill();
  // CG real line
  ctx.beginPath();ctx.strokeStyle='rgba(0,212,160,.95)';ctx.lineWidth=2;ctx.lineJoin='round';ctx.lineCap='round';
  ctx.moveTo(PAD.l,cumToY(cgStart));
  for(let i=0;i<dim;i++)ctx.lineTo(PAD.l+(i+0.5)*slotW,cumToY(cumLiq[i+1]));
  ctx.stroke();
  // CG projected line (dashed) — só se diferente
  const hasPending=cumAll.some((v,i)=>v!==cumLiq[i]);
  if(hasPending){
    ctx.beginPath();ctx.strokeStyle='rgba(0,212,160,.55)';ctx.lineWidth=1.8;ctx.setLineDash([5,4]);
    ctx.moveTo(PAD.l,cumToY(cgStart));
    for(let i=0;i<dim;i++)ctx.lineTo(PAD.l+(i+0.5)*slotW,cumToY(cumAll[i+1]));
    ctx.stroke();ctx.setLineDash([]);
  }
  // dots
  const dots=[[0,cgStart],[dim-1,cumLiq[dim]]];
  if(isNow&&today.getDate()<=dim&&today.getDate()>1&&today.getDate()<dim)dots.push([today.getDate()-1,cumLiq[today.getDate()]]);
  dots.forEach(([i,v])=>{const x=i===0?PAD.l:PAD.l+(i+0.5)*slotW;const y=cumToY(v);ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fillStyle='#060a14';ctx.fill();ctx.strokeStyle='var(--teal)';ctx.lineWidth=2;ctx.stroke();});
  if(isNow&&today.getDate()<=dim){const x=PAD.l+(today.getDate()-0.5)*slotW;ctx.strokeStyle='rgba(0,212,160,.35)';ctx.lineWidth=1;ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(x,PAD.t);ctx.lineTo(x,PAD.t+cH);ctx.stroke();ctx.setLineDash([]);}
  ctx.fillStyle='rgba(200,215,255,.35)';ctx.font='10px system-ui';ctx.textAlign='center';
  days.forEach((d,i)=>{if(d.day===1||d.day%7===0||d.day===dim)ctx.fillText(d.day,PAD.l+(i+0.5)*slotW,H-10);});
  // labels
  const lastL=cumLiq[dim],yL=cumToY(lastL);
  ctx.font='bold 11px system-ui';ctx.fillStyle=lastL>=0?'rgba(0,212,160,.95)':'rgba(255,79,106,.95)';ctx.textAlign='left';
  ctx.fillText(brlShort(lastL),PAD.l+cW+6,yL+4);
  if(hasPending){const lastA=cumAll[dim],yA=cumToY(lastA);ctx.fillStyle='rgba(0,212,160,.6)';ctx.font='10px system-ui';ctx.fillText('proj '+brlShort(lastA),PAD.l+cW+6,yA-4);}
  _chartData={days,cumLiq,cumAll,PAD,cW,cH,slotW,W,H};
}

function bindChartHover(){
  const canvas=document.getElementById('cfchart');
  const tt=document.getElementById('chart-tt');
  if(!canvas||!tt||!_chartData)return;
  canvas.onmousemove=e=>{
    const rect=canvas.getBoundingClientRect();
    const x=e.clientX-rect.left;
    const{days,cumLiq,cumAll,PAD,slotW,W}=_chartData;
    const i=Math.floor((x-PAD.l)/slotW);
    if(i<0||i>=days.length){tt.classList.remove('show');return;}
    const d=days[i];
    const hasPen=d.recA!==d.rec||d.pagA!==d.pag||d.proA!==d.pro;
    tt.innerHTML=`<div class="tt-d">${fmtDate(d.date)}</div>
      ${d.rec>0?`<div class="tt-line r"><span>Recebido</span><span>${brl(d.rec)}</span></div>`:''}
      ${d.pag>0?`<div class="tt-line p"><span>Pago</span><span>${brl(d.pag)}</span></div>`:''}
      ${d.pro>0?`<div class="tt-line p" style="color:var(--purple)"><span>Pró-labore</span><span>${brl(d.pro)}</span></div>`:''}
      ${hasPen?`<div class="tt-line" style="color:var(--orange);font-style:italic"><span>Agendado</span><span>${brl((d.recA-d.rec)+(d.pagA-d.pag)+(d.proA-d.pro))}</span></div>`:''}
      <div class="tt-line cg"><span>CG real</span><span>${brl(cumLiq[i+1])}</span></div>
      ${hasPen?`<div class="tt-line" style="color:var(--muted2)"><span>CG projetado</span><span>${brl(cumAll[i+1])}</span></div>`:''}`;
    tt.classList.add('show');
    const ttW=tt.offsetWidth||140;
    const cx=PAD.l+(i+0.5)*slotW;
    let lx=cx-ttW/2;if(lx<6)lx=6;if(lx+ttW>W-6)lx=W-ttW-6;
    tt.style.left=lx+'px';tt.style.top=(e.clientY-rect.top-tt.offsetHeight-12)+'px';
  };
  canvas.onmouseleave=()=>tt.classList.remove('show');
}
