// ── AGENDA ───────────────────────────────────────────
/* ═══ Pagamentos planejados por semana ═══
   Semana de segunda a domingo, igual ao calendário do dashboard.
   Só o que está agendado (pendente) — o que já liquidou não entra. */
function inicioSemana(iso){
  const d=new Date(iso+'T12:00:00');
  const dow=d.getDay();                 // 0=domingo
  d.setDate(d.getDate()-(dow===0?6:dow-1));
  return d.toISOString().split('T')[0];
}
function semanasAPagar(nSemanas){
  const today=todayStr();
  const pend=S.lancamentos.filter(l=>l.status==='pendente'&&l.tipo!=='recebimento');
  const semanas=[];
  let ini=inicioSemana(today);
  for(let i=0;i<nSemanas;i++){
    const fim=addDaysISO(ini,6);
    const doPeriodo=pend.filter(l=>l.data>=ini&&l.data<=fim);
    semanas.push({
      ini,fim,
      pagamentos:sum(doPeriodo.filter(l=>l.tipo==='pagamento')),
      prolabore:sum(doPeriodo.filter(l=>l.tipo==='prolabore')),
      qtd:doPeriodo.length,
      vencidos:doPeriodo.filter(l=>l.data<today).length
    });
    ini=addDaysISO(ini,7);
  }
  return semanas;
}
function blocoSemanas(){
  const semanas=semanasAPagar(6);
  const total=semanas.reduce((a,s)=>a+s.pagamentos+s.prolabore,0);
  if(total===0)return'';
  const maior=Math.max(...semanas.map(s=>s.pagamentos+s.prolabore),1);
  const hojeSem=inicioSemana(todayStr());
  return`
    <div class="sec-hdr" style="margin-top:4px">
      <span class="sec-ttl">📅 A pagar por semana</span>
      <span style="font-size:11px;color:var(--muted2)">segunda a domingo · só o que está agendado</span>
    </div>
    <div class="tbl-wrap" style="margin-bottom:18px">
      <table>
        <thead><tr>
          <th style="width:190px">Semana</th>
          <th>Peso</th>
          <th style="text-align:right;width:130px">Pagamentos</th>
          <th style="text-align:right;width:130px">Pró-labore</th>
          <th style="text-align:right;width:130px">Total</th>
        </tr></thead>
        <tbody>${semanas.map((s,i)=>{
          const t=s.pagamentos+s.prolabore;
          const pct=Math.round((t/maior)*100);
          const atual=s.ini===hojeSem;
          const rot=i===0?'Esta semana':i===1?'Próxima semana':`${fmtDate(s.ini).slice(0,5)} a ${fmtDate(s.fim).slice(0,5)}`;
          return`<tr ${atual?'style="background:rgba(0,212,160,.05)"':''}>
            <td>
              <div style="font-weight:${atual?'700':'600'};font-size:13px">${rot}</div>
              <div style="font-size:10.5px;color:var(--muted2);margin-top:1px">
                ${fmtDate(s.ini)} – ${fmtDate(s.fim)}${s.qtd?` · ${s.qtd} conta${s.qtd>1?'s':''}`:''}
                ${s.vencidos?` · <span style="color:var(--red)">${s.vencidos} vencida${s.vencidos>1?'s':''}</span>`:''}
              </div>
            </td>
            <td>
              <div style="background:var(--s2);border-radius:4px;height:7px;overflow:hidden;min-width:70px">
                <div style="height:100%;width:${pct}%;background:${t>0?'linear-gradient(90deg,var(--red),#ff8fa3)':'transparent'};border-radius:4px"></div>
              </div>
            </td>
            <td class="num" style="text-align:right;font-variant-numeric:tabular-nums;color:${s.pagamentos?'var(--red)':'var(--muted)'}">${s.pagamentos?brl(s.pagamentos):'—'}</td>
            <td class="num" style="text-align:right;font-variant-numeric:tabular-nums;color:${s.prolabore?'var(--purple)':'var(--muted)'}">${s.prolabore?brl(s.prolabore):'—'}</td>
            <td class="num" style="text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px">${t?brl(t):'—'}</td>
          </tr>`;}).join('')}
          <tr style="border-top:1px solid var(--border2)">
            <td colspan="4" style="font-weight:700;font-size:12px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px">Total nas 6 semanas</td>
            <td class="num" style="text-align:right;font-weight:800;font-size:15px;color:var(--red)">${brl(total)}</td>
          </tr>
        </tbody>
      </table>
    </div>`;
}

function renderAgenda(){
  const overdue=S.lancamentos.filter(l=>isOverdue(l)).sort((a,b)=>a.data.localeCompare(b.data));
  const today=todayStr();
  const upcoming=S.lancamentos.filter(l=>l.status==='pendente'&&l.data>=today).sort((a,b)=>a.data.localeCompare(b.data));
  // group by date
  const groups={};

    </div>

    ${blocoSemanas()}

    ${upcoming.length===0?`<div class="empty" style="background:var(--s1);border:1px solid var(--border);border-radius:12px"><div class="empty-icon">📭</div>Nenhum lançamento agendado<div style="margin-top:8px;font-size:12px">Adicione um boleto futuro escolhendo "Agendado" no formulário</div></div>`:`
    <div class="sec-hdr"><span class="sec-ttl">Próximos Lançamentos</span></div>
    <div style="display:flex;flex-direction:column;gap:14px">
      ${Object.entries(groups).map(([date,items])=>{
        const dist=daysBetween(today,date);

        const dayTotal=items.reduce((a,b)=>a+(b.tipo==='recebimento'?b.valor:-b.valor),0);

}

// ── ACTIONS ──────────────────────────────────────────
/* "1.234,56" e "1234.56" viram 1234.56. Ponto só é decimal quando não há vírgula. */
function valorBR(txt){
  let t = String(txt || '').trim().replace(/r\$/gi, '').replace(/\s/g, '');
  if (!t) return NaN;
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  return parseFloat(t);
}
/* Separa por + ; ou quebra de linha. Vírgula NÃO separa: aqui ela é decimal. */
function parseValores(txt){
  return String(txt || '')
    .split(/[+;\n\t]/)
    .map(valorBR)
    .filter(v => !isNaN(v) && v > 0);
}
/* Resumo ao vivo embaixo do campo: quantos boletos e quanto dá no total. */
function somaBoletos(el){
  if (!el) return;
  const pg = el.closest('.page') || document.querySelector('.page.active');
  const out = pg?.querySelector('[data-f="resumo"]');
  if (!out) return;
  const vals = parseValores(el.value);
  const separar = !!pg.querySelector('[data-f="separar"]')?.checked;
  if (vals.length < 2) {
    out.classList.remove('ativo');
    out.innerHTML = 'Vários boletos do mesmo fornecedor? Separe por <b>+</b> no valor: <code>120,50+89,90</code>';
    return;
  }
  const total = vals.reduce((a, b) => a + b, 0);
  out.classList.add('ativo');
  out.innerHTML = separar
    ? `${vals.length} boletos · <b>${brl(total)}</b> no total — vão entrar como ${vals.length} lançamentos`
    : `${vals.length} boletos · <b>${brl(total)}</b> no total — vai entrar como 1 lançamento somado`;
}

function addLanc(tipo){
  const pg=document.querySelector('.page.active');
  const cat=tipo==='prolabore'?'Pró-labore':pg.querySelector('[data-f="cat"]')?.value;
  const desc=pg.querySelector('[data-f="desc"]')?.value.trim()||'';
  const valores=parseValores(pg.querySelector('[data-f="val"]')?.value);
  const val=valores.reduce((a,b)=>a+b,0);
  const data=pg.querySelector('[data-f="data"]')?.value;
  const stEl=pg.querySelector('[data-f="status"] .active');
  const status=stEl?stEl.dataset.st:'liquidado';
  if(!valores.length||!val||val<=0||!data){toast('⚠️ Preencha valor e data.');return;}
  const parc=Math.max(1,Math.min(60,parseInt(pg.querySelector('[data-f="parc"]')?.value)||1));
  const inter=Math.max(1,Math.min(180,parseInt(pg.querySelector('[data-f="int"]')?.value)||30));
  const prev=calcCG();

  // Vários boletos no mesmo campo: ou vira um lançamento por boleto, ou um só
  // com a soma. Misturar com parcelamento faria conta errada, então é um ou outro.
  if(valores.length>1){
    if(parc>1){toast('⚠️ Use parcelas OU vários boletos, não os dois.');return;}
    const separar=!!pg.querySelector('[data-f="separar"]')?.checked;
    if(separar){
      valores.forEach((v,i)=>S.lancamentos.push({id:uid(),tipo,categoria:cat,
        descricao:(desc?desc+' ':'')+`(${i+1}/${valores.length})`,valor:v,data,status,
        dataLiq:status==='liquidado'?data:null}));
    }else{
      S.lancamentos.push({id:uid(),tipo,categoria:cat,
        descricao:(desc?desc+' ':'')+`(${valores.length} boletos)`,valor:val,data,status,
        dataLiq:status==='liquidado'?data:null});
    }
    save();render(page);refreshSidebarBadges();
    toast(separar
      ? `✓ ${valores.length} lançamentos criados · total ${brl(val)}`
      : `✓ ${valores.length} boletos somados em ${brl(val)}`);
    if(page==='dashboard'){const el=document.getElementById('cg-display');if(el)animateTo(el,prev,calcCG());}
    setTimeout(()=>{document.querySelector('.page.active')?.querySelector('[data-f="val"]')?.focus();},50);
    return;
  }

  if(parc>1){
    for(let i=0;i<parc;i++){
      const d=addDaysISO(data,i*inter);
      const st=i===0?status:'pendente';
      S.lancamentos.push({id:uid(),tipo,categoria:cat,descricao:(desc?desc+' ':'')+`(${i+1}/${parc})`,valor:val,data:d,status:st,dataLiq:st==='liquidado'?d:null});
    }
  }else{
    S.lancamentos.push({id:uid(),tipo,categoria:cat,descricao:desc,valor:val,data,status,dataLiq:status==='liquidado'?data:null});
  }
  save();render(page);refreshSidebarBadges();
  toast(parc>1?`✓ ${parc} parcelas de ${brl(val)} criadas`:(status==='liquidado'?'✓ Lançamento adicionado':'⏳ Agendado para '+fmtDate(data)));
  if(page==='dashboard'){const el=document.getElementById('cg-display');if(el)animateTo(el,prev,calcCG());}
  setTimeout(()=>{document.querySelector('.page.active')?.querySelector('[data-f="val"]')?.focus();},50);
}

function editLanc(id){
  const l=S.lancamentos.find(x=>x.id===id);if(!l)return;
  const isPro=l.tipo==='prolabore';
  const cats=isPro?[]:S.categories[l.tipo==='recebimento'?'recebimentos':'pagamentos'];
  showModal('Editar lançamento',`
    ${isPro?'':`<div class="fg" style="margin-bottom:10px"><label>Categoria</label><select id="ed-cat">${cats.map(c=>`<option ${c===l.categoria?'selected':''}>${escapeHtml(c)}</option>`).join('')}</select></div>`}
    <div class="fg" style="margin-bottom:10px"><label>Descrição</label><input id="ed-desc" type="text" value="${escapeHtml(l.descricao)}"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
      <div class="fg"><label>Valor (R$)</label><input id="ed-val" type="number" step="0.01" min="0" value="${l.valor}"></div>
      <div class="fg"><label>Data</label><input id="ed-data" type="date" value="${l.data}"></div>
    </div>
    <div class="fg"><label>Status</label>
      <div class="status-toggle" id="ed-status">
        <button class="${l.status==='liquidado'?'active liq':''}" data-st="liquidado" onclick="setLancStatus(this,'liquidado')">✓ Liquidado</button>
        <button class="${l.status==='pendente'?'active pen':''}" data-st="pendente" onclick="setLancStatus(this,'pendente')">⏳ Agendado</button>
      </div>
    </div>`,
  [{label:'Cancelar',cls:'btn-g',fn:closeModal},{label:'Salvar',cls:'btn-t',fn:()=>{
    const v=parseFloat(document.getElementById('ed-val').value);
    const d=document.getElementById('ed-data').value;
    if(!v||v<=0||!d){toast('⚠️ Valores inválidos.');return;}
    const prev=calcCG();
    l.valor=v;l.data=d;l.descricao=document.getElementById('ed-desc').value.trim();
    if(!isPro)l.categoria=document.getElementById('ed-cat').value;
    const newSt=document.querySelector('#ed-status .active').dataset.st;
    if(newSt!==l.status){l.status=newSt;l.dataLiq=newSt==='liquidado'?todayStr():null;}
    save();closeModal();render(page);refreshSidebarBadges();toast('✓ Lançamento atualizado');
    if(page==='dashboard'){const el=document.getElementById('cg-display');if(el)animateTo(el,prev,calcCG());}
  }}]);
  setTimeout(()=>document.getElementById('ed-val')?.focus(),50);
}

function quickLiquidate(id){
  const l=S.lancamentos.find(x=>x.id===id);if(!l||l.status==='liquidado')return;
  const today=todayStr();
  const isFuture=l.data>today;
  if(isFuture){
    showModal('Liquidar lançamento',`
      <p style="color:var(--muted2);font-size:13px;line-height:1.6;margin-bottom:14px">Este lançamento está agendado para <strong>${fmtDate(l.data)}</strong> (futuro). Em qual data ele foi efetivamente liquidado?</p>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn btn-t" onclick="doLiquidate('${id}','${today}')">✓ Liquidar hoje (${fmtDate(today)})</button>
        <button class="btn btn-g" onclick="doLiquidate('${id}','${l.data}')">📅 Manter data agendada (${fmtDate(l.data)})</button>
      </div>`,
      [{label:'Cancelar',cls:'btn-g',fn:closeModal}]);
  }else{
    doLiquidate(id,today);
  }
}
function doLiquidate(id,liqDate){
  const l=S.lancamentos.find(x=>x.id===id);if(!l)return;
  const prev=calcCG();
  l.status='liquidado';l.dataLiq=liqDate;l.data=liqDate;
  save();closeModal();render(page);refreshSidebarBadges();
  toast('✓ Liquidado em '+fmtDate(liqDate));
  if(page==='dashboard'){const el=document.getElementById('cg-display');if(el)animateTo(el,prev,calcCG());}
}

function confirmDelLanc(id){
  const l=S.lancamentos.find(x=>x.id===id);if(!l)return;
  showModal('Excluir lançamento',`<p style="color:var(--muted2);font-size:13px;line-height:1.6">Excluir <strong>${brl(l.valor)}</strong> de <strong>${escapeHtml(l.categoria)}</strong> em ${fmtDate(l.data)}?</p>`,
    [{label:'Cancelar',cls:'btn-g',fn:closeModal},{label:'Excluir',cls:'btn-d',fn:()=>{
      const prev=calcCG();
      S.lancamentos=S.lancamentos.filter(x=>x.id!==id);
      save();closeModal();render(page);refreshSidebarBadges();toast('Lançamento excluído');
      if(page==='dashboard'){const el=document.getElementById('cg-display');if(el)animateTo(el,prev,calcCG());}
    }}]);
}

// ── CATEGORIAS ───────────────────────────────────────
function renderCats(){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth()+1;
  const rows=budgetRows(y,m);
  const comTeto=rows.filter(r=>r.teto>0);
  const totTeto=comTeto.reduce((a,b)=>a+b.teto,0),totGasto=comTeto.reduce((a,b)=>a+b.gasto,0);
  document.getElementById('page-categorias').innerHTML=`
    <div class="page-title" style="margin-bottom:18px">Categorias & Orçamento</div>
    <div class="cat-grid">${catSection('recebimentos','💰 Recebimentos')}${catSection('pagamentos','📤 Pagamentos')}</div>
    <div class="panel" style="margin-top:16px">
      <div class="sec-hdr">
        <span class="sec-ttl">🎯 Teto mensal por categoria de pagamento</span>
        ${comTeto.length?`<span style="font-size:12px;color:var(--muted2)">${brl(totGasto)} de ${brl(totTeto)} · <strong style="color:${totTeto>0&&totGasto/totTeto>=1?'var(--red)':totTeto>0&&totGasto/totTeto>=.8?'var(--orange)':'var(--teal)'}">${totTeto>0?((totGasto/totTeto)*100).toFixed(0):0}%</strong></span>`:''}
      </div>
      <div style="font-size:12px;color:var(--muted2);margin-bottom:12px;line-height:1.6">Defina quanto pretende gastar por mês em cada categoria. O consumo considera o que está liquidado <strong>mais</strong> o que já está agendado no mês — deixe em branco ou zero para não acompanhar. O Radar avisa a partir de 80%.</div>
      ${rows.map(r=>{
        const pct=r.pct===null?0:Math.min(100,r.pct);
        const cor=r.pct===null?'var(--border2)':r.pct>=100?'var(--red)':r.pct>=80?'var(--orange)':'var(--teal)';
        return`<div class="bud-row">
          <div>
            <div class="bud-name"><span>${escapeHtml(r.cat)}</span><span>${brl(r.gasto)}${r.teto>0?` de ${brl(r.teto)} · ${r.pct.toFixed(0)}%`:''}</span></div>
            <div class="bud-track"><div class="bud-fill" style="width:${pct}%;background:${cor}"></div></div>
          </div>
          <input class="bud-input" type="number" min="0" step="50" placeholder="sem teto" value="${r.teto||''}" onchange="setBudget('${escapeHtml(r.cat).replace(/'/g,"\\'")}',this.value)">
        </div>`;}).join('')}
    </div>`;
}
function setBudget(cat,v){
  const n=parseFloat(v);
  if(!n||n<=0)delete S.budgets[cat];else S.budgets[cat]=n;
  save();renderCats();
  toast(!n||n<=0?'Teto removido':'✓ Teto de '+cat+': '+brl(n));
}
function catSection(tipo,titulo){return`<div class="cat-section"><div class="sec-hdr"><span style="font-size:14px;font-weight:700">${titulo}</span><button class="btn btn-t btn-sm" onclick="openAddCat('${tipo}')">＋ Nova</button></div><div class="cat-list">${S.categories[tipo].length===0?'<div style="color:var(--muted);font-size:13px;padding:6px">Nenhuma categoria</div>':S.categories[tipo].map((c,i)=>`<div class="cat-item"><span class="cat-name">${escapeHtml(c)}</span><button class="btn-ghost" onclick="delCat('${tipo}',${i})" style="color:var(--red)">✕</button></div>`).join('')}</div></div>`;}
function openAddCat(tipo){showModal(`Nova categoria — ${tipo==='recebimentos'?'Recebimento':'Pagamento'}`,`<div class="fg"><label>Nome</label><input id="nci" type="text" placeholder="Ex: Serviços, Perfumaria..." onkeydown="if(event.key==='Enter')document.getElementById('mb1').click()"></div>`,[{label:'Cancelar',cls:'btn-g',fn:closeModal},{label:'Adicionar',cls:'btn-t',fn:()=>{const v=document.getElementById('nci').value.trim();if(!v){toast('Digite um nome.');return;}if(S.categories[tipo].includes(v)){toast('Já existe.');return;}S.categories[tipo].push(v);save();closeModal();renderCats();toast('✓ Categoria adicionada');}}]);setTimeout(()=>document.getElementById('nci')?.focus(),50);}
function delCat(tipo,idx){const name=S.categories[tipo][idx];const n=S.lancamentos.filter(l=>l.categoria===name).length;showModal('Remover categoria',`<p style="color:var(--muted2);font-size:13px;line-height:1.6">Remover <strong>${escapeHtml(name)}</strong>?${n>0?` Usada em <strong>${n} lançamento(s)</strong>. Eles serão mantidos.`:''}</p>`,[{label:'Cancelar',cls:'btn-g',fn:closeModal},{label:'Remover',cls:'btn-d',fn:()=>{S.categories[tipo].splice(idx,1);save();closeModal();renderCats();toast('Categoria removida');}}]);}

// ── DADOS ────────────────────────────────────────────
function renderDados(){
  const n=S.lancamentos.length,kb=(JSON.stringify(S).length/1024).toFixed(1);
  const dsb=daysSinceBackup();
  const bkStale=dsb===null?S.lancamentos.length>0:dsb>7;
  const bkClass=bkStale?'border-color:rgba(245,200,66,.4)':'';
  const bkTxt=dsb===null
    ?'Você ainda não exportou nenhum backup. Os dados vivem só neste navegador — se ele limpar o cache, some tudo.'
    :dsb===0?'Último backup: <strong>hoje</strong>. Em dia.'
    :`Último backup: <strong>há ${dsb} dia${dsb>1?'s':''}</strong> (${fmtDate(S.lastBackup)}).${dsb>7?' Já passou da hora de baixar outro.':''}`;
  const cg=calcCG(),cgProj=calcCGProj();
  const liqN=S.lancamentos.filter(l=>l.status==='liquidado').length;
  const penN=S.lancamentos.filter(l=>l.status==='pendente').length;
  const firstLanc=S.lancamentos.length>0?[...S.lancamentos].sort((a,b)=>new Date(a.data)-new Date(b.data))[0].data:null;
  document.getElementById('page-dados').innerHTML=`
    <div class="page-title" style="margin-bottom:18px">Dados & Backup</div>
    <div class="dados-grid">
      <div class="dados-card">
        <h3>📊 Resumo</h3>
        <p>${n} lançamentos (${liqN} liquidados, ${penN} agendados) · ${kb} KB</p>
        <p style="margin-bottom:6px">CG Real: <strong style="color:${cg>=0?'var(--teal)':'var(--red)'}">${brl(cg)}</strong></p>
        <p>CG Projetado: <strong style="color:${cgProj>=0?'var(--teal)':'var(--red)'}">${brl(cgProj)}</strong></p>
        ${firstLanc?`<p style="font-size:11px;margin-top:8px">Primeiro lançamento: ${fmtDate(firstLanc)}</p>`:''}
      </div>
      <div class="dados-card" style="${bkClass}">
        <h3>⬇️ Exportar Backup</h3>
        <p>${bkTxt}</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-s" onclick="exportJSON()">Baixar JSON</button>
          <button class="btn btn-g" onclick="exportCSV()">Baixar CSV</button>
        </div>
        <p style="font-size:11px;margin-top:8px">O JSON restaura tudo aqui dentro. O CSV abre direto no Excel para conferência ou envio ao contador.</p>
      </div>
      <div class="dados-card">

// ── canvas da curva ──
function drawCurve(){
  const cv=document.getElementById('curvechart');if(!cv||!_curve)return;
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth,H=230;
  cv.width=W*dpr;cv.height=H*dpr;
  const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
  x.clearRect(0,0,W,H);
  const pts=_curve.pts;
  const pl=58,pr=12,pt=14,pb=26;
  const cw=W-pl-pr,ch=H-pt-pb;
  const vals=pts.map(p=>p.saldo).concat([0,_curve.cg]);
  let mx=Math.max(...vals),mn=Math.min(...vals);
  const pad=(mx-mn)*.12||100;mx+=pad;mn-=pad;
  const X=i=>pl+(i/(pts.length-1))*cw;
  const Y=v=>pt+ch-((v-mn)/(mx-mn))*ch;
  // grade
  x.strokeStyle='#1e2d44';x.lineWidth=1;x.fillStyle='#4a5e82';x.font='10px Segoe UI,system-ui,sans-serif';
  for(let g=0;g<=4;g++){
    const v=mn+((mx-mn)/4)*g,yy=Y(v);
    x.beginPath();x.moveTo(pl,yy);x.lineTo(W-pr,yy);x.stroke();
    x.textAlign='right';x.fillText(brlShort(v),pl-7,yy+3);
  }
  // zona negativa
  if(mn<0){
    const y0=Y(0),yb=pt+ch;
    x.fillStyle='rgba(255,79,106,.09)';
    x.fillRect(pl,y0,cw,Math.max(0,yb-y0));
    x.strokeStyle='rgba(255,79,106,.5)';x.beginPath();x.moveTo(pl,y0);x.lineTo(W-pr,y0);x.stroke();
  }
  // linha do caixa de hoje
  x.setLineDash([4,4]);x.strokeStyle='#6a7fa8';x.beginPath();x.moveTo(pl,Y(_curve.cg));x.lineTo(W-pr,Y(_curve.cg));x.stroke();x.setLineDash([]);
  // área + linha
  const grad=x.createLinearGradient(0,pt,0,pt+ch);
  grad.addColorStop(0,'rgba(0,212,160,.28)');grad.addColorStop(1,'rgba(0,212,160,0)');
  x.beginPath();x.moveTo(X(0),Y(pts[0].saldo));
  pts.forEach((p,i)=>x.lineTo(X(i),Y(p.saldo)));
  x.lineTo(X(pts.length-1),Y(Math.max(mn,0)));x.lineTo(X(0),Y(Math.max(mn,0)));x.closePath();
  x.fillStyle=grad;x.fill();
  x.beginPath();pts.forEach((p,i)=>i?x.lineTo(X(i),Y(p.saldo)):x.moveTo(X(i),Y(p.saldo)));
  x.strokeStyle='#00d4a0';x.lineWidth=2;x.stroke();
  // trecho negativo em vermelho
  x.beginPath();let started=false;
  pts.forEach((p,i)=>{if(p.saldo<0){if(!started){x.moveTo(X(i),Y(p.saldo));started=true;}else x.lineTo(X(i),Y(p.saldo));}else started=false;});
  x.strokeStyle='#ff4f6a';x.lineWidth=2.5;x.stroke();
  // marcador do dia crítico
  if(_curve.critical){
    const i=pts.findIndex(p=>p.iso===_curve.critical.iso);
    if(i>=0){
      x.strokeStyle='rgba(255,79,106,.65)';x.setLineDash([3,3]);
      x.beginPath();x.moveTo(X(i),pt);x.lineTo(X(i),pt+ch);x.stroke();x.setLineDash([]);
      x.fillStyle='#ff4f6a';x.beginPath();x.arc(X(i),Y(pts[i].saldo),4,0,7);x.fill();
    }
  }
  // eixo de datas
  x.fillStyle='#4a5e82';x.textAlign='center';
  const step=Math.max(1,Math.round(pts.length/7));
  for(let i=0;i<pts.length;i+=step){
    x.fillText(pts[i].iso.slice(8,10)+'/'+pts[i].iso.slice(5,7),X(i),H-8);
  }
  cv._geo={pl,pr,pt,ch,cw,X,Y,pts};
}
function bindCurveHover(){
  const cv=document.getElementById('curvechart'),tt=document.getElementById('curve-tt');
  if(!cv||!tt||!cv._geo)return;
  cv.onmousemove=e=>{
    const g=cv._geo,r=cv.getBoundingClientRect();
    const mx=e.clientX-r.left;
    let i=Math.round(((mx-g.pl)/g.cw)*(g.pts.length-1));
    i=Math.max(0,Math.min(g.pts.length-1,i));
    const p=g.pts[i];
    tt.innerHTML=`<strong>${WD3[p.wd]} ${fmtDate(p.iso)}</strong><br>Saldo: <strong style="color:${p.saldo>=0?'#00d4a0':'#ff4f6a'}">${brl(p.saldo)}</strong>`
      +(p.agIn?`<br>Agendado a receber: ${brl(p.agIn)}`:'')
      +(p.agOut?`<br>Agendado a pagar: ${brl(p.agOut)}`:'')
      +`<br><span style="color:#6a7fa8">entra ${brlShort(p.inflow)} · sai ${brlShort(p.outflow)}</span>`;
    tt.classList.add('show');
    tt.style.left=Math.min(r.width-190,Math.max(0,g.X(i)-90))+'px';
    tt.style.top=Math.max(0,g.Y(p.saldo)-70)+'px';
  };
  cv.onmouseleave=()=>{tt.classList.remove('show');};
}

    ${list.length?`<div class="srch-tot" style="margin-bottom:16px">
      <div><div class="l">Ativas</div><div class="v">${list.filter(r=>r.ativa).length}</div></div>
      <div><div class="l">Saída fixa/mês</div><div class="v" style="color:var(--red)">${brl(load.out)}</div></div>
      ${load.rec>0?`<div><div class="l">Entrada fixa/mês</div><div class="v" style="color:var(--teal)">${brl(load.rec)}</div></div>`:''}
      <div><div class="l">Agendamentos gerados</div><div class="v">${S.lancamentos.filter(l=>l.recId&&l.status==='pendente').length}</div></div>
    </div>`:''}

    ${list.length===0?`<div class="empty" style="background:var(--s1);border:1px solid var(--border);border-radius:12px">
      <div class="empty-icon">🔁</div>Nenhuma recorrência cadastrada
      <div style="margin-top:8px;font-size:12px">Comece pelo aluguel e pela energia — são os que você mais relança na mão.</div>
      <div style="margin-top:14px"><button class="btn btn-t" onclick="openRecForm()">＋ Criar a primeira</button></div>
    </div>`:`
    <div class="rec-grid">${list.map(r=>{
      const cor=r.tipo==='recebimento'?'var(--teal)':r.tipo==='pagamento'?'var(--red)':'var(--purple)';
      const prox=recOccurrences(r,todayStr(),addDaysISO(todayStr(),REC_HORIZON))[0];
      return`<div class="rec-card ${r.ativa?'':'off'}">
        <div class="rec-top">
          <div style="min-width:0">
            <div class="rec-cat">${escapeHtml(r.categoria)}</div>
            ${r.descricao?`<div class="rec-desc">${escapeHtml(r.descricao)}</div>`:''}
          </div>
          <div class="rec-val" style="color:${cor}">${r.tipo==='recebimento'?'+':'−'}${brl(r.valor)}</div>
        </div>
        <div class="rec-meta">
          <span class="rec-chip">${recLabel(r)}</span>
          ${r.ajusteDomingo?'<span class="rec-chip">domingo → segunda</span>':''}
          ${r.fim?`<span class="rec-chip">até ${fmtDate(r.fim)}</span>`:''}
        </div>
        <div style="font-size:11px;color:var(--muted2);margin-bottom:10px">
          ${r.ativa?(prox?`Próxima: <strong style="color:var(--text)">${fmtDate(prox)}</strong> · ${recFutureCount(r.id)} agendada(s) à frente`:'Sem ocorrências no horizonte'):'Pausada — não gera novos agendamentos'}
        </div>
        <div class="rec-acts">
          <span class="sw ${r.ativa?'on':''}" onclick="toggleRec('${r.id}')" title="Ativar/pausar"><i></i>${r.ativa?'ativa':'pausada'}</span>
          <span style="flex:1"></span>
          <button class="btn-ghost" onclick="openRecForm('${r.id}')" title="Editar">✏️</button>
          <button class="btn-ghost" onclick="confirmDelRec('${r.id}')" title="Excluir" style="color:var(--red)">✕</button>
        </div>
      </div>`;}).join('')}</div>`}`;
}

function openRecForm(id){
  const r=id?(S.recorrencias||[]).find(x=>x.id===id):null;
  const tipo=r?r.tipo:'pagamento';
  const catsFor=t=>t==='prolabore'?['Pró-labore']:S.categories[t==='recebimento'?'recebimentos':'pagamentos'];
  showModal(r?'Editar recorrência':'Nova recorrência',`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
      <div class="fg"><label>Tipo</label>
        <select id="rf-tipo" onchange="recFormCats()">
          <option value="pagamento" ${tipo==='pagamento'?'selected':''}>📤 Pagamento</option>
          <option value="recebimento" ${tipo==='recebimento'?'selected':''}>💰 Recebimento</option>
          <option value="prolabore" ${tipo==='prolabore'?'selected':''}>👤 Pró-labore</option>
        </select>
      </div>
      <div class="fg"><label>Categoria</label><select id="rf-cat">${catsFor(tipo).map(c=>`<option ${r&&r.categoria===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}</select></div>
    </div>
    <div class="fg" style="margin-bottom:10px"><label>Descrição</label><input id="rf-desc" type="text" value="${r?escapeHtml(r.descricao||''):''}" placeholder="Aluguel da loja, contador, energia..."></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
      <div class="fg"><label>Valor (R$)</label><input id="rf-val" type="number" step="0.01" min="0" value="${r?r.valor:''}" placeholder="0,00"></div>
      <div class="fg"><label>Frequência</label>
        <select id="rf-freq" onchange="recFormFreq()">
          <option value="mensal" ${!r||r.freq==='mensal'?'selected':''}>Mensal</option>
          <option value="semanal" ${r&&r.freq==='semanal'?'selected':''}>Semanal</option>
          <option value="quinzenal" ${r&&r.freq==='quinzenal'?'selected':''}>Quinzenal</option>
          <option value="anual" ${r&&r.freq==='anual'?'selected':''}>Anual</option>
        </select>
      </div>
    </div>
    <div id="rf-when" style="margin-bottom:10px"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
      <div class="fg"><label>Começa em</label><input id="rf-ini" type="date" value="${r?r.inicio:todayStr()}"></div>
      <div class="fg"><label>Termina em <span style="color:var(--muted);font-weight:400">(opcional)</span></label><input id="rf-fim" type="date" value="${r&&r.fim?r.fim:''}"></div>
    </div>
    <label class="chk"><input type="checkbox" id="rf-dom" ${!r||r.ajusteDomingo?'checked':''}> Se cair no domingo, joga para segunda</label>
  `,[
    {label:'Cancelar',cls:'btn-g',fn:closeModal},
    {label:r?'Salvar':'Criar',cls:'btn-t',fn:()=>saveRec(id)}
  ]);
  recFormFreq(r);
}
function recFormCats(){
  const t=document.getElementById('rf-tipo').value;
  const cats=t==='prolabore'?['Pró-labore']:S.categories[t==='recebimento'?'recebimentos':'pagamentos'];
  document.getElementById('rf-cat').innerHTML=cats.map(c=>`<option>${escapeHtml(c)}</option>`).join('');
}
function recFormFreq(r){
  const f=document.getElementById('rf-freq').value;
  const w=document.getElementById('rf-when');
  if(f==='mensal'){
    w.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="fg"><label>Referência do dia</label>
        <select id="rf-modo">
          <option value="fixo" ${!r||r.modo!=='util'?'selected':''}>Dia fixo do mês</option>
          <option value="util" ${r&&r.modo==='util'?'selected':''}>N-ésimo dia útil</option>
        </select>
      </div>
      <div class="fg"><label>Dia</label><input id="rf-dia" type="number" min="1" max="31" value="${r&&r.freq==='mensal'?r.dia:5}"></div>
    </div>`;
  }else if(f==='semanal'){
    w.innerHTML=`<div class="fg"><label>Dia da semana</label><select id="rf-dia">${WDFULL.map((n,i)=>`<option value="${i}" ${r&&r.freq==='semanal'&&r.dia===i?'selected':''}>${n}</option>`).join('')}</select></div>`;
  }else if(f==='quinzenal'){
    w.innerHTML=`<div style="font-size:12px;color:var(--muted2);background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:9px 12px">A cada 14 dias, contando a partir da data de início.</div>`;
  }else{
    w.innerHTML=`<div style="font-size:12px;color:var(--muted2);background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:9px 12px">Repete todo ano no mesmo dia e mês da data de início.</div>`;
  }
}
function saveRec(id){
  const g=x=>document.getElementById(x);
  const tipo=g('rf-tipo').value;
  const valor=parseFloat(g('rf-val').value);
  const inicio=g('rf-ini').value;
  const freq=g('rf-freq').value;
  if(!valor||valor<=0){toast('⚠️ Informe um valor.');return;}
  if(!inicio){toast('⚠️ Informe a data de início.');return;}
  const dia=g('rf-dia')?parseInt(g('rf-dia').value):1;
  if(freq==='mensal'&&(!dia||dia<1||dia>31)){toast('⚠️ Dia inválido.');return;}
  const obj={
    id:id||uid(),
    tipo,
    categoria:tipo==='prolabore'?'Pró-labore':g('rf-cat').value,
    descricao:g('rf-desc').value.trim(),
    valor,freq,
    dia:isNaN(dia)?1:dia,
    modo:g('rf-modo')?g('rf-modo').value:'fixo',
    inicio,
    fim:g('rf-fim').value||null,
    ajusteDomingo:g('rf-dom').checked,
    ativa:true
  };
  if(!Array.isArray(S.recorrencias))S.recorrencias=[];
  if(id){
    const i=S.recorrencias.findIndex(x=>x.id===id);
    obj.ativa=S.recorrencias[i].ativa;
    S.recorrencias[i]=obj;
    // regenera: apaga os futuros ainda pendentes desta recorrência
    const t=todayStr();
    S.lancamentos=S.lancamentos.filter(l=>!(l.recId===id&&l.status==='pendente'&&l.data>=t));
  }else{
    S.recorrencias.push(obj);
  }
  save();
  const n=materializeRecs();
  closeModal();renderRecs();refreshSidebarBadges();
  toast(`✓ Recorrência salva · ${n} agendamento(s) gerado(s)`);
}
function toggleRec(id){
  const r=(S.recorrencias||[]).find(x=>x.id===id);if(!r)return;
  r.ativa=!r.ativa;
  if(!r.ativa){
    const t=todayStr();
    S.lancamentos=S.lancamentos.filter(l=>!(l.recId===id&&l.status==='pendente'&&l.data>=t));
    save();renderRecs();refreshSidebarBadges();toast('Recorrência pausada · agendamentos futuros removidos');
  }else{
    save();const n=materializeRecs();renderRecs();refreshSidebarBadges();toast(`Recorrência ativada · ${n} agendamento(s) gerado(s)`);
  }
}
function confirmDelRec(id){
  const r=(S.recorrencias||[]).find(x=>x.id===id);if(!r)return;
  const n=recFutureCount(id);
  showModal('Excluir recorrência',`<p style="color:var(--muted2);font-size:13px;line-height:1.6">Excluir <strong>${escapeHtml(r.categoria)}${r.descricao?' · '+escapeHtml(r.descricao):''}</strong>?<br><br>${n>0?`Isso também remove os <strong>${n} agendamento(s) futuro(s)</strong> gerados por ela. Lançamentos já liquidados permanecem no histórico.`:'Nenhum agendamento futuro será afetado.'}</p>`,
  [{label:'Cancelar',cls:'btn-g',fn:closeModal},{label:'Excluir',cls:'btn-d',fn:()=>{
    const t=todayStr();
    S.recorrencias=S.recorrencias.filter(x=>x.id!==id);
    S.lancamentos=S.lancamentos.filter(l=>!(l.recId===id&&l.status==='pendente'&&l.data>=t));
    save();closeModal();renderRecs();refreshSidebarBadges();toast('Recorrência excluída');
  }}]);
}

// ══ v7 · BUSCA GLOBAL ═══════════════════════════════
let sq={q:'',tipo:'',status:'',de:'',ate:''};
function setSq(k,v){sq[k]=v;renderBusca(true);}
function searchResults(){
  let r=S.lancamentos.filter(l=>{
    if(sq.tipo&&l.tipo!==sq.tipo)return false;
    if(sq.status&&l.status!==sq.status)return false;
    if(sq.de&&l.data<sq.de)return false;
    if(sq.ate&&l.data>sq.ate)return false;
    if(sq.q){
      const t=sq.q.toLowerCase();
      if(!((l.descricao||'').toLowerCase().includes(t)||(l.categoria||'').toLowerCase().includes(t)||String(l.valor).includes(t)))return false;
    }
    return true;
  });
  return r.sort((a,b)=>b.data.localeCompare(a.data));
}
function quickRange(k){
  const t=todayStr();
  if(k==='mes'){const n=new Date();sq.de=n.getFullYear()+'-'+pad2i(n.getMonth()+1)+'-01';sq.ate=t;}
  else if(k==='90'){sq.de=addDaysISO(t,-89);sq.ate=t;}
  else if(k==='ano'){sq.de=t.slice(0,4)+'-01-01';sq.ate=t;}
  else{sq.de='';sq.ate='';}
  renderBusca();
}
function renderBusca(keepFocus){
  const res=searchResults();
  const rec=sum(res.filter(l=>l.tipo==='recebimento'));
  const pag=sum(res.filter(l=>l.tipo==='pagamento'));
  const pro=sum(res.filter(l=>l.tipo==='prolabore'));
  document.getElementById('page-busca').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:12px;flex-wrap:wrap">
      <div class="page-title">🔎 Busca</div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-g btn-sm" onclick="quickRange('mes')">Este mês</button>
        <button class="btn btn-g btn-sm" onclick="quickRange('90')">90 dias</button>
        <button class="btn btn-g btn-sm" onclick="quickRange('ano')">Este ano</button>
        <button class="btn btn-g btn-sm" onclick="quickRange('')">Tudo</button>
      </div>
    </div>
    <div style="font-size:12px;color:var(--muted2);margin-bottom:16px">Procura em todos os meses de uma vez, sem precisar navegar. <strong>Ctrl+K</strong> abre daqui de qualquer tela.</div>
    <div class="srch-grid">
      <div class="fg"><label>Texto</label><input id="sq-q" type="text" value="${escapeHtml(sq.q)}" placeholder="categoria, descrição ou valor" oninput="sq.q=this.value;renderBusca(true)"></div>
      <div class="fg"><label>Tipo</label><select onchange="setSq('tipo',this.value)">
        <option value="">Todos</option>
        <option value="recebimento" ${sq.tipo==='recebimento'?'selected':''}>Recebimento</option>
        <option value="pagamento" ${sq.tipo==='pagamento'?'selected':''}>Pagamento</option>
        <option value="prolabore" ${sq.tipo==='prolabore'?'selected':''}>Pró-labore</option>
      </select></div>
      <div class="fg"><label>Status</label><select onchange="setSq('status',this.value)">
        <option value="">Todos</option>
        <option value="liquidado" ${sq.status==='liquidado'?'selected':''}>Liquidado</option>
        <option value="pendente" ${sq.status==='pendente'?'selected':''}>Agendado</option>
      </select></div>
      <div class="fg"><label>De</label><input type="date" value="${sq.de}" onchange="setSq('de',this.value)"></div>
      <div class="fg"><label>Até</label><input type="date" value="${sq.ate}" onchange="setSq('ate',this.value)"></div>
      <button class="btn btn-s" onclick="exportCSV(searchResults(),'busca')">⬇️ CSV</button>
    </div>
    <div class="srch-tot">
      <div><div class="l">Resultados</div><div class="v">${res.length}</div></div>
      <div><div class="l">Recebimentos</div><div class="v" style="color:var(--teal)">${brl(rec)}</div></div>
      <div><div class="l">Pagamentos</div><div class="v" style="color:var(--red)">${brl(pag)}</div></div>
      <div><div class="l">Pró-labore</div><div class="v" style="color:var(--purple)">${brl(pro)}</div></div>
      <div><div class="l">Saldo</div><div class="v" style="color:${rec-pag-pro>=0?'var(--teal)':'var(--red)'}">${brl(rec-pag-pro)}</div></div>
    </div>
    <div class="tbl-wrap">
      ${res.length===0?`<div class="empty"><div class="empty-icon">🔎</div>Nenhum lançamento com esses filtros</div>`:`
      <table>
        <thead><tr><th>Data</th><th>Status</th><th>Tipo</th><th>Categoria</th><th>Descrição</th><th style="text-align:right">Valor</th><th style="width:80px"></th></tr></thead>
        <tbody>${res.slice(0,400).map(l=>`<tr class="lanc-row ${l.status==='pendente'?'pending':''} ${isOverdue(l)?'overdue':''}" ondblclick="editLanc('${l.id}')">
          <td>${fmtDate(l.data)}</td>
          <td>${statusBadge(l)}</td>
          <td>${l.tipo==='recebimento'?'<span class="badge bg">Receb.</span>':l.tipo==='pagamento'?'<span class="badge br">Pag.</span>':'<span class="badge bp">Pró-lab.</span>'}</td>
          <td>${escapeHtml(l.categoria)}</td>
          <td>${escapeHtml(l.descricao)||'<span style="color:var(--muted)">—</span>'}${l.recId?' <span class="rec-chip" style="font-size:9px">🔁</span>':''}</td>
          <td style="text-align:right;font-weight:700">${brl(l.valor)}</td>
          <td><div class="row-actions"><button class="btn-ghost" onclick="editLanc('${l.id}')">✏️</button><button class="btn-ghost" onclick="confirmDelLanc('${l.id}')" style="color:var(--red)">✕</button></div></td>
        </tr>`).join('')}</tbody>
      </table>`}
    </div>
    ${res.length>400?`<div style="font-size:11px;color:var(--muted);margin-top:8px">Mostrando os 400 mais recentes de ${res.length}. Refine os filtros ou baixe o CSV completo.</div>`:''}`;
  if(keepFocus){const el=document.getElementById('sq-q');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}}
}
function openBusca(){navigate('busca');setTimeout(()=>document.getElementById('sq-q')?.focus(),60);}

// ── MODAL ────────────────────────────────────────────
function showModal(ttl,body,actions){document.getElementById('modal-title').textContent=ttl;document.getElementById('modal-body').innerHTML=body;document.getElementById('modal-acts').innerHTML=actions.map((a,i)=>`<button class="btn ${a.cls}" id="mb${i}">${a.label}</button>`).join('');actions.forEach((a,i)=>document.getElementById('mb'+i).onclick=a.fn);document.getElementById('modal').classList.add('show');}
function closeModal(){document.getElementById('modal').classList.remove('show');const b=document.querySelector('#modal .modal');if(b)b.classList.remove('wide');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modal').classList.contains('show'))closeModal();});

let tt;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2600);}

// ── ATALHOS v7 ───────────────────────────────────────
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openBusca();}
});

// ── PWA (opcional: só funciona se o arquivo estiver hospedado) ──
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// ── INIT ─────────────────────────────────────────────
const today=new Date();
if(today.getFullYear()===fY&&today.getMonth()+1===fM)selectedDay=todayStr();
const _gen=materializeRecs();
render('dashboard');
refreshSidebarBadges();
if(_gen>0)setTimeout(()=>toast(`🔁 ${_gen} agendamento(s) gerado(s) pelas recorrências`),700);
</script>
</body>
</html>
