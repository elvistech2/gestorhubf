# Gera os instaladores e publica no Release do GitHub.
# Dispara ao subir uma tag: git tag v1.0.1 && git push origin v1.0.1
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            comando: npm run dist:win
          - os: ubuntu-latest
            comando: npm run dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # better-sqlite3 é módulo nativo: no Linux precisa das ferramentas de build
      - name: Dependências de build (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - run: npm ci

      - name: Gerar e publicar
        run: ${{ matrix.comando }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
          if-no-files-found: ignore
